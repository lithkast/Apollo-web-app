    else if (['manager', 'role', 'job'].includes(field)) { p[field] = v; done = true; }
  } else if (kind === 'f') {
    if (field === 'disclaimer') d.disclaimer = String(v).split(/\n\s*\n/).map(s => s.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
    else if (field === 'before') d.before = String(v).split('\n').map(s => s.trim()).filter(Boolean);
    else if (field === 'hours') { d.hours = String(v).replace(/\s*\n\s*/g, ' '); const pv = main.querySelector('[data-fe-hours]'); if (pv) pv.textContent = fillHours(d.hours).trim() || 'No hours line: Before you apply starts with the points below.'; }
    else if (field === 'roleTitle' || field === 'roleHelp') d.roleQuestion = {...(d.roleQuestion || {}), [field === 'roleTitle' ? 'title' : 'help']: v};
    else if (field === 'stepPos' || field === 'stepDisc') d.stepTitles = {...(d.stepTitles || {}), [field === 'stepPos' ? 'position' : 'disclaimer']: v};

}
const feListOf = key => key.startsWith('pos:') ? ui.fe.draft.positions[Number(key.slice(4))].questions : ui.fe.draft.questions;
function feAct(name, el) {
  const fe = ui.fe; if (!fe) return;
  const d = fe.draft, id = el.dataset.id;
  if (name === 'fe-sec') { fe.sec = el.dataset.sec; fe.preview = false; scheduleRender(); return; }
  if (name === 'fe-preview') { fe.preview = !fe.preview; fe.pv = {step: 1, ans: {}, tried: 0}; scheduleRender(); toContentTop(); return; }
  if (name === 'fe-close') { ui.fe = null; scheduleRender(); toContentTop(); return; }
  if (name === 'fe-save') { feSave(); return; }
  if (name === 'fe-add') {
    const list = feListOf(el.dataset.list), k = el.dataset.kind, q = {id: feId(), kind: k, title: ''};
    if (k === 'choice') q.opts = ['Yes', 'No'];
    if (el.dataset.list.startsWith('step:')) q.step = el.dataset.list.slice(5);
    list.push(q); fe.focus = q.id;
  } else if (name === 'fe-del' || name === 'fe-up' || name === 'fe-down') {
    const hit = feFind(id); if (!hit || hit.q.lock && name === 'fe-del') return;
    if (name === 'fe-del') {
      const dep = hit.scope.find(x => x.when && x.when.q === id);
      if (dep) { toast(`“${feCut(dep.title, 50)}” is asked only after an answer to this question. Change that one first.`); return; }
      hit.list.splice(hit.i, 1);
    } else {
      // move past the next or previous question of the same step
      const same = hit.list.map((x, i) => [x, i]).filter(([x]) => hit.list === d.questions ? x.step === hit.q.step : true).map(([, i]) => i);
      const at = same.indexOf(hit.i), to = same[at + (name === 'fe-up' ? -1 : 1)];
      if (to == null) return;
      [hit.list[hit.i], hit.list[to]] = [hit.list[to], hit.list[hit.i]];
      fe.focus = id;
    }
  } else if (name === 'fe-step-add') {
    const s = {id: 's' + Math.random().toString(36).slice(2, 7), title: 'New step', heading: ''};
    d.steps.push(s); fe.sec = 'step:' + s.id;
  } else if (name === 'fe-step-del' || name === 'fe-step-up' || name === 'fe-step-down') {
    const i = d.steps.findIndex(s => s.id === id); if (i < 0) return;
    if (name === 'fe-step-del') {
      if (d.questions.some(q => q.step === id && q.lock)) return;
      d.steps.splice(i, 1); d.questions = d.questions.filter(q => q.step !== id); fe.sec = 'step:' + d.steps[Math.max(0, i - 1)].id;
    } else {
      const to = i + (name === 'fe-step-up' ? -1 : 1); if (to < 0 || to >= d.steps.length) return;
      [d.steps[i], d.steps[to]] = [d.steps[to], d.steps[i]];
    }
  } else if (name === 'fe-pos-add') {
    d.positions.push({name: 'New position', emoji: '⭐', blurb: '', role: 'none', job: '', manager: '', retired: false, questions: []});
    fe.sec = 'pos:' + (d.positions.length - 1);
  } else if (name === 'fe-pos-del' || name === 'fe-pos-up' || name === 'fe-pos-down') {
    const i = Number(el.dataset.i); if (!d.positions[i]) return;
    if (name === 'fe-pos-del') { d.positions.splice(i, 1); fe.sec = d.positions.length ? 'pos:' + Math.max(0, i - 1) : 'step:' + d.steps[0].id; }
    else {
      const to = i + (name === 'fe-pos-up' ? -1 : 1); if (to < 0 || to >= d.positions.length) return;

    }

    fe.sec = 'step:' + fe.draft.steps[0].id;

  if (fe.focus) {
    const qid = fe.focus, add = name === 'fe-add'; fe.focus = null;
    setTimeout(() => { const el = document.getElementById('feq-' + qid); if (el) { el.scrollIntoView({block: 'center'}); const t = el.querySelector('textarea'); if (add && t) t.focus(); } }, 80);
  }
}
// what would stop the draft from saving, with the part of the editor it is in
function feCheck(d) {
  const errs = [], ids = new Set(['role', 'agree']), add = (sec, msg) => errs.push({sec, msg});
  const checkList = (qs, sec, label) => {
    const seen = [];
    for (const q of qs) {
      if (ids.has(q.id)) q.id = feId();
      ids.add(q.id);
      const name = `“${feCut(q.title, 50) || 'a question'}”`;
      if (!String(q.title || '').trim()) add(sec, `${label}: a ${q.kind === 'info' ? 'note' : 'question'} has no text.`);
      if (q.kind === 'choice') {
        if (!(q.opts || []).length) add(sec, `${label}: ${name} has no choices.`);
        else if (new Set(q.opts).size !== q.opts.length) add(sec, `${label}: ${name} has the same choice twice.`);
        if (q.stop && !q.opts.includes(q.stop.on)) add(sec, `${label}: ${name} stops the application on an answer that is no longer a choice.`);
      }
      if (q.when) {
        const ref = seen.find(x => x.id === q.when.q);
        if (!ref) add(sec, `${label}: ${name} is asked after a question that is no longer above it.`);
        else if (!(q.when.is || []).length) add(sec, `${label}: tick which answers to “${feCut(ref.title, 40)}” bring up ${name}.`);
      }
      seen.push(q);
    }
  };
  d.steps.forEach((s, i) => {
    if (!String(s.title || '').trim()) add('step:' + s.id, `Step ${i + 1} has no name.`);
    checkList(d.questions.filter(q => q.step === s.id), 'step:' + s.id, s.title || 'Step ' + (i + 1));
  });
  const names = d.positions.map(p => String(p.name || '').trim());
  d.positions.forEach((p, i) => {
    const sec = 'pos:' + i, n = names[i];
    if (!n) add(sec, 'A position has no name.');
    else if (n.length > 40) add(sec, `${n}: a position name can be 40 characters at most.`);
    else if (names.indexOf(n) !== i) add(sec, `There are two positions called ${n}.`);
    checkList(p.questions, sec, n || 'A position');
  });
  if (!d.positions.some(p => !p.retired)) add(d.positions.length ? 'pos:0' : 'step:' + d.steps[0].id, 'At least one position has to be offered.');
  if (!String(d.agree || '').trim()) add('disclaimer', 'The disclaimer needs an answer to agree with.');
  return errs;
}
async function feSave() {
  const fe = ui.fe; if (!fe || fe.saving || !canEditForm()) return;
  const d = clone(fe.draft);
  // tidy: no questions left over from a removed step, text without stray spaces
  const steps = new Set(d.steps.map(s => s.id));
  d.questions = d.questions.filter(q => steps.has(q.step));
  const trim = q => { for (const k of ['title', 'help', 'short', 'heading']) if (typeof q[k] === 'string') { q[k] = q[k].trim(); if (!q[k] && k !== 'title') delete q[k]; } };
  d.questions.forEach(trim); d.positions.forEach(p => { p.name = String(p.name || '').trim(); p.emoji = String(p.emoji || '').trim(); p.blurb = String(p.blurb || '').trim(); p.questions.forEach(trim); });
  const errs = feCheck(d);
  if (errs.length) { fe.errs = errs; fe.sec = errs[0].sec; fe.preview = false; scheduleRender(); toContentTop(); return; }
  fe.errs = [];
  // a renamed position keeps its Hiring/Full switch
  const renames = d.positions.filter(p => p._was && p._was !== p.name).map(p => [p._was, p.name]);
  d.positions.forEach(p => { delete p._was; });
  d.managers = Object.fromEntries(d.positions.filter(p => MANAGER_NAMES[p.manager]).map(p => [p.name, p.manager]));
  d.hours = String(d.hours ?? DEFAULT_FORM.hours).trim().slice(0, 300);
  d.by = myName(); d.at = Date.now();
  const ops = [['set', 'appform/main', d]], h = hiring();
  if (renames.some(([a]) => a in h.roles)) {
    const roles = {...h.roles};
    for (const [a, b] of renames) if (a in roles) { roles[b] = roles[a]; delete roles[a]; }
    ops.push(['set', 'hiring/main', {open: h.open, roles, by: myName(), at: Date.now()}]);
  }
  fe.saving = true; scheduleRender();
  try {
    await store.batch(ops);
    state.docs['appform/main'] = clone(d);
    fe.draft = clone(d); for (const k of ['by', 'at', 'managers']) delete fe.draft[k];
    fe.draft.positions.forEach(p => { p._was = p.name; });
    fe.base = JSON.stringify(d); fe.dirty = false;
    toast('Saved. Join the Staff and the application show your changes now.');
    formChanged();
  } catch (e) { onWriteError(e); }
  fe.saving = false; scheduleRender();
}

/* ───────────── logging the whole night at once (the administrator's profile) ───────────── */
// Every page keeps its own Log to Data button for managers. The administrator also gets one button that logs each
// page that has something to log and has not been logged for the chosen night yet. Pages already logged are left
// exactly as they are.
const LOG_ORDER = ['reception', 'raffle', 'casino', 'bar', 'staff'];
const LOG_TAB = {reception: 'reception', raffle: 'raffle', casino: 'casino', bar: 'bar', staff: 'hr'};
// what has to have arrived before a page's numbers can be trusted
const LOG_NEEDS = {reception: ['reception', 'night/reception'], raffle: ['raffle'], casino: ['night/casino'], bar: ['buyouts'], staff: ['hr']};
function logState(section) {
  if (!store || !['nights', 'config/main', ...LOG_NEEDS[section]].every(k => store.has(k))) return {k: 'wait'};
  const d = nightDoc(night());
  if (d && d[section]) return {k: 'done', at: d[section].loggedAt};
  const snap = SNAP[section]();
  return snap ? {k: 'ready', snap} : {k: 'none'};
}
const plural = (n, w) => `${fmtNum(n)} ${w}${n === 1 ? '' : 's'}`;
function logSummary(section, s) {
  if (section === 'reception') return `${plural(s.bookings.length, 'booking')}, ${gil(s.total) || '0g'}`;
  if (section === 'raffle') return `${plural(s.tickets, 'ticket')}, ${gil(s.total) || '0g'} pot`;
  if (section === 'casino') return `${gil(s.gross) || '0g'} gross`;
  if (section === 'bar') return `${plural(s.count, 'buyout')}, ${gil(s.total) || '0g'}`;
  return `${fmtNum(s.roster.filter(r => r.showed).length)} showed up, ${gil(s.payTotal) || '0g'} pay`;
}
function logNightPanel() {
  if (!me.admin || !canLog()) return '';
  const n = night(), rows = LOG_ORDER.map(s => [s, logState(s)]);
  const ready = rows.filter(([, x]) => x.k === 'ready').length, waiting = rows.some(([, x]) => x.k === 'wait');
  const status = (s, x) => x.k === 'wait' ? 'Fetching' : x.k === 'done' ? `Logged${isNum(x.at) ? ' at ' + fmtClock(x.at) : ''}` : x.k === 'ready' ? 'Ready: ' + logSummary(s, x.snap) : 'Nothing to log';
  const label = waiting ? 'Fetching the pages' : ready ? `Log ${ready === 1 ? '1 page' : ready + ' pages'} to Data` : rows.every(([, x]) => x.k === 'done') ? 'Everything is logged' : 'Nothing left to log';
  return `<section class="panel lognight" aria-labelledby="ln-h">
    <div class="lnhead"><h3 id="ln-h">Log the night</h3>
      <span class="nightpick"><label for="night-all">Night of</label><input class="field" id="night-all" type="date" value="${n}" data-night="1" data-fk="night-all" aria-label="Night to log everything under"></span></div>
    <p>Logs every page that has something to log and has not been logged for ${nightLabel(n)} yet. Pages already logged are left as they are.</p>
    ${collabOn() ? `<p class="collabline">Collab night is on, so this night is logged as a collab night: hourly pay at ${fmtRate(collabRate())} and no missed days.</p>` : ''}
    <ul class="lnlist">${rows.map(([s, x]) => `<li class="${x.k}"><button type="button" class="textlink" data-act="go" data-tab="${LOG_TAB[s]}">${SECTION_NAMES[s]}</button><span>${status(s, x)}</span></li>`).join('')}</ul>
    <button type="button" class="btn primary" data-act="log-all"${ready && !waiting && !ui.ro ? '' : ' disabled'}>${label}</button>
  </section>`;
}
function logAll() {
  if (!me.admin || ui.ro || !canLog()) return;
  const n = night(), rows = LOG_ORDER.map(s => [s, logState(s)]);
  if (rows.some(([, x]) => x.k === 'wait')) { toast('Still fetching the pages. Try again in a moment.'); return; }
  const ready = rows.filter(([, x]) => x.k === 'ready').map(([s]) => s), done = rows.filter(([, x]) => x.k === 'done').map(([s]) => SECTION_NAMES[s]);
  if (!ready.length) { toast(done.length ? `Everything with something to log is already logged for ${nightLabel(n)}.` : `There is nothing to log for ${nightLabel(n)} yet.`); return; }
  let extra = '';
  for (const s of ready) extra += logSection(s, true) || '';
  toast(`${listWords(ready.map(s => SECTION_NAMES[s]))} logged for ${nightLabel(n)}${collabOn() ? ' as a collab night' : ''}.${extra}${done.length ? ` ${listWords(done)} ${done.length === 1 ? 'was' : 'were'} already logged and left as ${done.length === 1 ? 'it was' : 'they were'}.` : ''}`);
}

];
const GAME_MAX = {id: 40, name: 80, eyebrow: 80, title: 160, facts: 1200, howTitle: 120, rules: 8000, note: 600};
const gamesOf = cfg => (Array.isArray(cfg && cfg.games) ? cfg.games : DEFAULT_GAMES).filter(g => g && typeof g === 'object').map((g, i) => Object.fromEntries(Object.keys(GAME_MAX).map(k => [k, String(g[k] == null ? '' : g[k]).slice(0, GAME_MAX[k])]))).map((g, i) => ({...g, id: slugify(g.id) || 'game-' + (i + 1)}));
// a game's text: the card's own formatting, and links that open in a new tab
const gameText = s => cardInline(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)'"]/g, u => `<a href="${u}" rel="noopener">${u}</a>`);
const GAME_CSS = `.apc ul.steps{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.apc ul.steps li{position:relative;padding-left:26px}
.apc ul.steps li::before{content:"";position:absolute;left:4px;top:.66em;width:7px;height:7px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 0 2px #000,0 0 0 3px rgba(226,185,95,.45),0 0 10px rgba(226,185,95,.45)}
.apc ul.steps b,.apc .fact b{color:var(--gold-hi);font-weight:600}
.apc ul.steps em{color:var(--white);font-style:normal;font-weight:600}
.apc .credit{margin:30px 0 0;text-align:center}
.apc .credit .qmark{margin-bottom:12px}
.apc .credit .qmark span.dia{width:9px;height:9px;transform:rotate(45deg);background:var(--white);box-shadow:0 0 0 3px #000,0 0 0 4px var(--gold),0 0 14px rgba(255,255,255,.5)}
.apc .credit p{margin:0;color:var(--white);font:italic 500 19px/1.5 'Cormorant Garamond',Georgia,serif}
.apc a{color:var(--gold-hi);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;overflow-wrap:anywhere}
.apc.game h1{font-size:clamp(30px,9vw,50px)}
.apc.game{box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column}
[data-apollo-measure] .apc.game{min-height:0}
.apc.game .rule{width:100%}
.apc.game .fours{display:flex;flex-wrap:wrap}
.apc.game .fours .fact{flex:1 1 170px}
.apc.game .credit{margin-top:auto;padding-top:30px}
.apc.game h2{text-align:center;line-height:1.7}
.apc.game h2::before,.apc.game h2::after{min-width:22px}`;
function gameCardHtml(g) {
  const lines = v => String(v || '').replace(/\r\n?/g, '\n').split('\n').map(x => x.trim()).filter(Boolean);
  const facts = lines(g.facts).map(x => { const i = x.indexOf(':'); return i > 0 ? [x.slice(0, i).trim(), x.slice(i + 1).trim()] : ['', x]; });
  const rules = lines(g.rules).map(x => x.replace(/^[-•*◆]\s+/, '')), note = String(g.note || '').trim();
  return CARD_CSS + `<style>${GAME_CSS}</style><div class="apc game"><header>${g.eyebrow.trim() ? `<p class="eyebrow">${esc(g.eyebrow.trim())}</p>` : ''}<h1>${esc(g.name.trim() || 'A game')}</h1>${g.title.trim() ? `<p class="title">${gameText(g.title.trim())}</p>` : ''}</header>`
    + (facts.length ? `<div class="rule"><span></span></div><div class="fours">${facts.map(([k, v]) => `<div class="fact">${k ? `<span class="k">${esc(k)}</span>` : ''}<span class="v">${gameText(v)}</span></div>`).join('')}</div>` : '')
    + (rules.length ? `<h2>${esc(g.howTitle.trim() || 'How to play')}</h2><ul class="steps">${rules.map(r => `<li>${gameText(r)}</li>`).join('')}</ul>` : '')
    + (note ? `<footer class="credit"><div class="qmark" aria-hidden="true"><span class="dia"></span></div><p>${gameText(note)}</p></footer>` : '')
    + '</div>';
}
const gamesNow = () => gamesOf(state.config);
// the code for an Embed element on the Carrd: every game, or one
function casinoCode(id) {
  const o = location.origin, g = id && gamesNow().find(x => x.id === id);
  return `<iframe src="${o}/embed/casino${id ? '/' + encodeURIComponent(id) : ''}" title="${esc(g ? g.name + ' rules' : 'Apollo Casino rules')}" data-apollo-embed style="display:block;width:100%;height:900px;border:0;background:transparent" loading="lazy"></iframe>\n`
    + `<script>if(!window.apolloEmbeds){window.apolloEmbeds=1;addEventListener('message',function(e){if(e.origin!=='${o}'||!e.data||!e.data.apolloEmbed)return;document.querySelectorAll('iframe[data-apollo-embed]').forEach(function(f){if(f.contentWindow===e.source)f.style.height=Math.min(Math.max(e.data.h,40),12000)+'px'})})}<\/script>`;
}
// the administrator's editor: each game's words beside how its card looks, saved as they are typed
const GAME_FORM = [['name', 'Name', 'half'], ['eyebrow', 'Above the name', 'half'], ['title', 'Under the name', 'wide'],
  ['facts', 'Key facts, one per line, as Label: Value', 'wide', 4], ['howTitle', 'Heading over the rules', 'wide'], ['rules', 'The rules, one per line', 'wide', 14], ['note', 'A line at the bottom (optional)', 'wide', 2]];
function gamesEditor() {
  const gs = ui.games, n = gs.length;
  const field = (g, i, [k, label, wide, rows]) => {
    const id = `game-${i}-${k}`, attrs = `id="${id}" data-game="${i}" data-gf="${k}" data-fk="game:${esc(g.id)}:${k}" maxlength="${GAME_MAX[k]}"`;
    return `<label class="acf ${wide}" for="${id}"><span>${label}</span>${rows ? `<textarea class="field" rows="${rows}" ${attrs}>${esc(g[k])}</textarea>` : `<input class="field" ${attrs} value="${esc(g[k])}">`}</label>`;
  };
  const one = (g, i) => {
    const del = 'game-del:' + g.id, on = ui.confirm === del;
    return `<section class="panel gameedit" id="game-${esc(g.id)}"><div class="gehead"><h3>${esc(g.name || 'A game')}</h3><span class="geacts">
        <button type="button" class="btn sm quiet" data-act="game-move" data-i="${i}" data-d="-1"${i === 0 ? ' disabled' : ''} aria-label="Move ${esc(g.name)} up">Up</button>
        <button type="button" class="btn sm quiet" data-act="game-move" data-i="${i}" data-d="1"${i === n - 1 ? ' disabled' : ''} aria-label="Move ${esc(g.name)} down">Down</button>
        <button type="button" class="btn sm ${on ? 'danger' : 'quiet'}" data-act="game-del" data-i="${i}" data-confirm="${esc(del)}">${on ? 'Click again to remove it' : 'Remove'}</button></span></div>
      <div class="gegrid"><div class="acform">${GAME_FORM.map(f => field(g, i, f)).join('')}
        <p class="note">**bold** and *highlighted* work anywhere here, and so do links. On the Carrd this game is <code>/embed/casino/${esc(g.id)}</code>.</p></div>
        <div class="codeprev" data-gameprev="${esc(g.id)}">${codeSlot('game:' + g.id, gameCardHtml(g), `${g.name || 'Game'} rules`)}</div></div></section>`;
  };
  const copy = (id, label) => `<button type="button" class="btn sm" data-act="casino-copy" data-id="${esc(id)}">${esc(label)}</button>`;
  return `<p class="editbanner" role="status">You're editing the rules. They save as you type, and the Carrd shows them straight away.</p>
    ${gs.map(one).join('')}
    <p><button type="button" class="btn" data-act="game-add">Add a game</button></p>
    <section class="panel carrdlinks"><h3>On the Carrd</h3><p class="note">Add an Embed element (Type: Code, Style: Inline) where the rules go, and paste one of these. It shows the same cards as this page, and follows every change you make here.</p>
      <div class="row">${copy('', 'Copy the code for every game')}${gs.map(g => copy(g.id, `Copy the code for ${g.name || 'this game'}`)).join('')}</div></section>`;
}
let gameSave = null, gamePaint = {};
function gameInput(t) {
  const i = Number(t.dataset.game), g = ui.games && ui.games[i]; if (!g || !me.admin) return;
  g[t.dataset.gf] = t.value.slice(0, GAME_MAX[t.dataset.gf]);
  clearTimeout(gamePaint[g.id]); gamePaint[g.id] = setTimeout(() => paintGame(g), 250);
  clearTimeout(gameSave); gameSave = setTimeout(saveGames, 900);
}
// the preview, without redrawing the page (which would take the cursor out of the field)
function paintGame(g) {
  const fr = main.querySelector(`[data-gameprev="${CSS.escape(g.id)}"] iframe.codeframe`); if (!fr) return;
  const doc = frameDoc(gameCardHtml(g)); if (fr.srcdoc !== doc) fr.srcdoc = doc;
  const h = main.querySelector(`#game-${CSS.escape(g.id)} .gehead h3`); if (h) h.textContent = g.name || 'A game';
}
function saveGames() {
  clearTimeout(gameSave); gameSave = null;
  if (!me.admin || !ui.games) return;
  cfgSet('games', ui.games.map(g => ({...g})));
}
function gamesAct(name, el) {
  if (name === 'game-jump') { const t = main.querySelector('#game-' + CSS.escape(el.dataset.id)); if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (!me.admin) return;
  if (name === 'games-edit') { ui.games = gamesNow().map(g => ({...g})); ui.gameEdit = true; scheduleRender(); return; }
  if (name === 'games-done') { if (gameSave) saveGames(); ui.gameEdit = false; ui.games = null; scheduleRender(); toContentTop(); return; }
  if (name === 'casino-copy') { copyText(casinoCode(el.dataset.id), null).then(ok => toast(ok ? 'The code is copied. Paste it into an Embed element on the Carrd.' : 'Copy was blocked here. Try again, or copy it from a computer.')); return; }
  const gs = ui.games; if (!gs) return;
  if (name === 'game-add') {
    let id = 'game', n = 1; while (gs.some(g => g.id === id)) id = 'game-' + (++n);
    gs.push({id, name: 'A new game', eyebrow: 'Apollo Casino', title: '', facts: '', howTitle: 'How to play', rules: '', note: ''});
  } else if (name === 'game-move') {
    const i = Number(el.dataset.i), j = i + Number(el.dataset.d); if (j < 0 || j >= gs.length) return; [gs[i], gs[j]] = [gs[j], gs[i]];
  } else if (name === 'game-del') {
    ui.confirm = null; gs.splice(Number(el.dataset.i), 1);
  } else return;
  saveGames(); scheduleRender();
}

/* ───────────── start ───────────── */
paintThemeColor(); paintTabs(); paintHours(); paintStatus(); paintAccount(); render();

(() => {
  if (!window.firebase || typeof firebase.firestore !== 'function' || typeof firebase.auth !== 'function') {
    ui.mode = 'offline'; paintStatus();
    main.innerHTML = '<p class="empty">The ledger could not be reached. Check your connection, then reload the page.</p>';
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  try { db.settings({ignoreUndefinedProperties: true}); } catch { /* already set */ }
  auth = firebase.auth();
  store = ledgerStore(db);
  let started = false, stopMcard = null, stopAcct = null, stopProfile = null, stopCard = null, stopEarn = null, stopSignup = null, stopSync = null, turn = 0, wasWaiting = false;
  auth.onAuthStateChanged(async user => {
    const mine = ++turn;
    if (stopAcct) { stopAcct(); stopAcct = null; }
    if (stopProfile) { stopProfile(); stopProfile = null; }
    if (stopCard) { stopCard(); stopCard = null; }
    if (stopEarn) { stopEarn(); stopEarn = null; }
    if (stopSignup) { stopSignup(); stopSignup = null; }
    if (stopSync) { stopSync(); stopSync = null; }
    me.sync = null;
    me.earn = null; me.signup = null; me.signupLoaded = false; me.acctLoaded = false; wasWaiting = false;
    // the next person on this device starts each section of the bar on its first page
    if (!user) for (const k of Object.keys(lastIn)) delete lastIn[k];
    me.user = user || null; me.admin = false; me.acct = null; me.profile = null; me.profileLoaded = false; me.checked = false;
    // someone signing in on a profile (anyone can see those) stays on it: its address opens it again once the site
    // knows who they are (signing out still starts the next person afresh)
    if (user && !ui.want && (ui.tab === 'people' || ui.tab === 'mortals') && ui.person) ui.want = parseAddress(location.pathname);
    me.card = null; me.cardLoaded = false; cardMoved = false; ui.person = null; ui.peopleOpen = false; ui.mortalsOpen = false;
    // an open HR card or drink card belongs to whoever opened it
    ui.hrOpen = null; ui.barOpen = null;
    me.pcard = null; me.pcardLoaded = false; me.mcard = null; me.mcardLoaded = false; mortalCardMade = false; mortalCardMoved = false;
    if (stopMcard) { stopMcard(); stopMcard = null; }
    ui.pw = {cur: '', next: '', again: ''};
    if (!started) { started = true; store.start(() => { ui.ready = true; setMode('live'); render(); }); }
    permsChanged();
    if (!user) return;
    // this login's own permissions, live, so a change by the administrator applies without signing in again
    stopAcct = db.doc('accounts/' + user.uid).onSnapshot(
      s => {
        if (mine !== turn) return;
        const had = !!me.acct; me.acct = s.exists ? s.data() : null; me.acctLoaded = true;
        if (!had && me.acct && wasWaiting) { wasWaiting = false; toast('You are on the staff now. Welcome to Apollo!'); }
        permsChanged();
      },
      () => { if (mine !== turn) return; me.acct = null; me.acctLoaded = true; permsChanged(); }
    );
    // this person's own sync codes
    stopSync = db.doc('sync/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.sync = s.exists ? s.data() : null; scheduleRender(true); },
      () => { if (mine !== turn) return; me.sync = null; }
    );
    // this person's own sign-up, while it waits for approval
    stopSignup = db.doc('signups/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.signup = s.exists ? s.data() : null; me.signupLoaded = true; if (me.signup) wasWaiting = true; permsChanged(); },
      () => { if (mine !== turn) return; me.signup = null; me.signupLoaded = true; permsChanged(); }
    );
    // only the administrator's login may read this document, so being able to read it is the administrator test
    // this login's own picture, and whether it has chosen its own password yet
    stopProfile = db.doc('profiles/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.profile = s.exists ? s.data() : null; me.profileLoaded = true; permsChanged(); },
      () => { if (mine !== turn) return; me.profile = null; me.profileLoaded = true; permsChanged(); }
    );
    // this login's card in the staff directory: the username and picture other staff see
    stopCard = db.doc('people/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.pcard = s.exists ? s.data() : null; me.pcardLoaded = true; permsChanged(); },
      () => { if (mine !== turn) return; me.pcard = null; me.pcardLoaded = true; permsChanged(); }
    );
    // and their card on Mortal Profiles, while they are a Mortal (and until it moves, once they are staff)
    stopMcard = db.doc('mortals/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.mcard = s.exists ? s.data() : null; me.mcardLoaded = true; permsChanged(); },
      () => { if (mine !== turn) return; me.mcard = null; me.mcardLoaded = true; permsChanged(); }
    );
    // what this login has earned, worked out for it by the administrator's or an owner's session
    stopEarn = db.doc('earnings/' + user.uid).onSnapshot(
      s => { if (mine !== turn) return; me.earn = s.exists ? s.data() : null; scheduleRender(true); },
      () => { if (mine !== turn) return; me.earn = null; }
    );
    try { await db.doc('admin/ping').get(); if (mine === turn) me.admin = true; }
    catch { /* not the administrator */ }
    if (mine === turn) { me.checked = true; permsChanged(); }
  });
})();

})();
</script>
