 from doing wrong. She and Nemesis were said to be the last to abandon mankind."},{"n":"Aion","of":"eternity, cyclical time, and the ages","d":"A god of unbounded time, often shown standing inside the wheel of the zodiac."},{"n":"Alecto","of":"unceasing anger and punishment of moral crimes","d":"One of the three Furies. Her name means \"the unceasing one\"."},{"n":"Aletheia","of":"truth and sincerity","d":"Spirit of truth, the opposite of Dolos (trickery) and Apate (deceit)."},{"n":"Alpheus","of":"the Alpheus River and freshwater","d":"River god of the Peloponnese who chased the nymph Arethusa beneath the sea all the way to Sicily."},{"n":"Amphitrite","of":"the sea; queen of the sea","d":"A Nereid who became the wife of Poseidon and queen of the sea. Mother of Triton."},{"n":"Ananke","of":"necessity, compulsion, and inevitability","d":"Primordial goddess of necessity, whom even the gods cannot resist. In Orphic myth she is the mate of Chronos."},{"n":"Anemoi","of":"the four winds","d":"Boreas, Notus, Eurus and Zephyrus, the sons of Astraeus and Eos."},{"n":"Anteros","of":"requited love and avenger of unreturned love","d":"Son of Ares and Aphrodite, given to Eros as a brother and playmate. He punishes those who scorn the love of others."},{"n":"Apate","of":"deceit, fraud, and deception","d":"Daughter of Nyx and spirit of deceit. Her opposite is Aletheia, the spirit of truth."},{"n":"Aphrodite","of":"love, beauty, desire, pleasure, and procreation","d":"Olympian goddess born from the sea foam. Wife of Hephaestus and lover of Ares, with the dove, the rose and the myrtle as her symbols."},{"n":"Apollo","of":"music, prophecy, healing, archery, poetry, light, and plague","d":"Olympian son of Zeus and Leto and twin of Artemis. Lord of the oracle at Delphi and leader of the Muses, with the lyre and the laurel as his symbols."},{"n":"Ares","of":"war, battle, bloodshed, and courage","d":"Olympian son of Zeus and Hera, and the violent, untamed side of war. Lover of Aphrodite and father of Phobos and Deimos."},{"n":"Arete","of":"excellence, virtue, and moral goodness","d":"Spirit of virtue and excellence. She offered the young Heracles the hard road of glory in place of the easy road of pleasure."},{"n":"Ariadne","of":"mazes and labyrinths","d":"The Cretan princess who helped Theseus escape the Labyrinth. Abandoned on Naxos, she married Dionysus and was made immortal."},{"n":"Aristaeus","of":"beekeeping, olive growing, herding, hunting, and rural crafts","d":"Son of Apollo and the nymph Cyrene, who taught mortals beekeeping, cheese-making and olive growing."},{"n":"Artemis","of":"the hunt, wilderness, wild animals, childbirth, and young girls","d":"Olympian daughter of Zeus and Leto and twin of Apollo. A virgin huntress with her bow and hunting dogs, and protector of the young."},{"n":"Asclepius","of":"medicine and healing","d":"Son of Apollo, taught medicine by the centaur Chiron. He grew so skilled that he raised the dead, and Zeus struck him down before making him a god."},{"n":"Asopus","of":"the Asopus River and freshwater","d":"River god and father of many nymph daughters, among them Aegina, whom Zeus carried off."},{"n":"Asteria","of":"falling stars, nighttime divination, and oracles","d":"Titaness, daughter of Coeus and Phoebe and mother of Hecate. She leapt into the sea to escape Zeus and became the island of Delos."},{"n":"Astraea","of":"justice, innocence, purity, and the stars","d":"The star maiden, last of the immortals to leave the earth as mankind grew wicked. She became the constellation Virgo."},{"n":"Astraeus","of":"dusk, stars, planets, and astrology","d":"Titan of the dusk, husband of Eos and father of the four winds and the stars."},{"n":"Ate","of":"ruin, reckless impulse, delusion, and folly","d":"Spirit of delusion and ruin. Zeus threw her out of Olympus, and she has walked among mortals ever since."},{"n":"Athena","of":"wisdom, strategy, crafts, cities, and defensive warfare","d":"Olympian goddess born fully armed from the head of Zeus. Patron of Athens, with the owl and the olive tree as her symbols."},{"n":"Atlas","of":"endurance, astronomy, and the bearing of the heavens","d":"Titan, son of Iapetus. After the Titans lost their war, Zeus condemned him to hold up the sky forever."},{"n":"Atropos","of":"cutting the thread of life","d":"Eldest of the three Fates, \"the one who cannot be turned\". She chooses how each life ends and cuts its thread."},{"n":"Aura","of":"breezes and fresh morning air","d":"Titaness of the breeze, daughter of Lelantos. A swift huntress and companion of Artemis."},{"n":"Auxo","of":"growth and the flourishing of plants","d":"Worshipped at Athens as a goddess of growth, and counted among either the Seasons or the Graces."},{"n":"Bia","of":"force, might, and raw power","d":"Daughter of Pallas and Styx. With her siblings Nike, Cratus and Zelus she stands beside the throne of Zeus."},{"n":"Boreas","of":"the north wind and winter","d":"One of the four wind gods. The north wind and bringer of winter, who carried off the Athenian princess Oreithyia."},{"n":"Brizo","of":"sailors, navigation, and prophetic dreams","d":"A goddess worshipped by the women of Delos, who set out offerings in small boats. She sent prophetic dreams."},{"n":"Calliope","of":"epic poetry and eloquence","d":"Eldest of the nine Muses and mother of Orpheus, shown with a writing tablet."},{"n":"Calypso","of":"the hidden island of Ogygia","d":"The nymph who kept Odysseus on her island for seven years and offered to make him immortal."},{"n":"Carpo","of":"fruit, harvest, and ripening","d":"One of the Seasons honoured at Athens, bringing the fruit of autumn."},{"n":"Cephissus","of":"the Cephissus River and freshwater","d":"River god and father of Narcissus."},{"n":"Chaos","of":"the primordial void and gap from which creation emerged","d":"The first of all beings. After Chaos came Gaia, Tartarus and Eros, and from Chaos were born Erebus and Nyx."},{"n":"Charites (Graces)","of":"grace, beauty and joy","d":"Aglaea, Euphrosyne and Thalia, daughters of Zeus and Eurynome and attendants of Aphrodite."},{"n":"Charon","of":"the ferrying of the dead across the rivers of the Underworld","d":"Ferryman of the dead, son of Erebus and Nyx. He is paid with a coin placed in the mouth of the dead."},{"n":"Chloris","of":"flowers, blossoms, and spring","d":"Nymph of flowers and wife of Zephyrus, the west wind. The Romans called her Flora."},{"n":"Chronos","of":"time in Orphic cosmology","d":"The personification of time in Orphic myth. He is often confused with the Titan Cronus."},{"n":"Circe","of":"sorcery and transformation","d":"Daughter of Helios and enchantress of the island of Aeaea, who turned the crew of Odysseus into pigs."},{"n":"Clio","of":"history","d":"One of the nine Muses, shown holding a scroll."},{"n":"Clotho","of":"spinning the thread of life","d":"Youngest of the three Fates. She spins the thread of each life."},{"n":"Clymene","of":"fame and renown","d":"An Oceanid Titaness, wife of Iapetus and mother of Atlas, Prometheus, Epimetheus and Menoetius."},{"n":"Coeus","of":"intellect, inquiry, and the axis of heaven","d":"Titan, husband of Phoebe and father of Leto and Asteria."},{"n":"Comus","of":"revelry, festivity and merrymaking at night","d":"A companion of Dionysus, shown as a winged youth drowsy with wine and carrying a torch."},{"n":"Cratus (Kratos)","of":"strength, power, and sovereign authority","d":"Son of Pallas and Styx and brother of Nike, Bia and Zelus. An enforcer of Zeus, who helped chain Prometheus to his rock."},{"n":"Crius","of":"the constellations and the ordering of the heavens","d":"Titan, husband of Eurybia and father of Astraeus, Pallas and Perses."},{"n":"Cronus","of":"the harvest, agriculture, and the Golden Age","d":"Youngest of the Titans and their king. He overthrew his father Uranus and swallowed his own children, until Zeus overthrew him in turn."},{"n":"Cymopoleia","of":"violent sea storms, waves, and storm surges","d":"Daughter of Poseidon, given in marriage to the hundred-handed giant Briareus."},{"n":"Deimos","of":"terror and dread in battle","d":"Son of Ares and Aphrodite and twin of Phobos. He rides into battle beside his father."},{"n":"Demeter","of":"agriculture, grain, harvest, fertility, and sacred law","d":"Olympian sister of Zeus and mother of Persephone. Her grief while her daughter is in the Underworld brings winter."},{"n":"Despoina","of":"Arcadian mysteries and sacred fertility rites","d":"\"The Mistress\", daughter of Demeter and Poseidon. Her true name was told only to those initiated into her mysteries."},{"n":"Dike","of":"justice, fair judgment, and moral order","d":"One of the Horae, daughter of Zeus and Themis. She reports the injustices of mortals to her father."},{"n":"Dione","of":"divine prophecy and the oracle at Dodona","d":"A Titaness worshipped beside Zeus at Dodona. In Homer she is the mother of Aphrodite."},{"n":"Dionysus","of":"wine, ecstasy, theater, festivity, madness, and vegetation","d":"Olympian son of Zeus and the mortal Semele. The twice-born god, followed by maenads and satyrs, with the vine, the ivy and the thyrsus as his symbols."},{"n":"Dolos","of":"trickery, deception, and cunning","d":"Spirit of trickery and guile, the male counterpart of Apate."},{"n":"Doris","of":"the bounty and fertility of the sea","d":"An Oceanid, wife of Nereus and mother of the fifty Nereids."},{"n":"Dysnomia","of":"lawlessness and civil disorder","d":"Daughter of Eris and spirit of lawlessness, the opposite of Eunomia."},{"n":"Eileithyia","of":"childbirth and labor","d":"Daughter of Zeus and Hera, who comes to women in labour. Hera more than once held her back to delay a birth."},{"n":"Eirene","of":"peace and prosperity","d":"One of the Horae, daughter of Zeus and Themis. She is shown carrying the infant Plutus, the god of wealth."},{"n":"Eleos","of":"mercy, pity, and compassion","d":"Spirit of pity and mercy, honoured with an altar in Athens where those in need took refuge."},{"n":"Elpis","of":"hope and expectation","d":"The spirit of hope, the only one left inside Pandora's jar after everything else had escaped."},{"n":"Enyo","of":"war, destruction, and bloodshed","d":"Goddess of war and sacker of cities, the companion of Ares in battle."},{"n":"Eos","of":"the dawn","d":"Titaness of the dawn and sister of Helios and Selene. Rosy-fingered, she opens the gates of heaven each morning."},{"n":"Eosphorus (Phosphorus)","of":"the morning star","d":"The planet Venus in the dawn sky, a son of Eos. His other name means \"light-bringer\"."},{"n":"Epimetheus","of":"afterthought and hindsight","d":"Titan and brother of Prometheus. He took Pandora as his wife in spite of his brother's warning."},{"n":"Epione","of":"the soothing of pain","d":"Wife of Asclepius and mother of his healing daughters."},{"n":"Erato","of":"love poetry and erotic verse","d":"One of the nine Muses, shown with a lyre."},{"n":"Erebos (Erebus)","of":"darkness and shadow","d":"Primordial god of darkness, born of Chaos. With Nyx he fathered Aether and Hemera."},{"n":"Erinyes (Furies)","of":"vengeance for crimes against family","d":"Alecto, Megaera and Tisiphone, born from the blood of Uranus. They hound murderers and oath-breakers."},{"n":"Eris","of":"strife, discord, rivalry, and conflict","d":"Goddess of strife. Left out of the wedding of Peleus and Thetis, she threw in the golden apple that led to the Trojan War."},{"n":"Eros","of":"love, sexual desire, attraction, and procreation","d":"God of love. In Hesiod he is a primordial being; later he is the winged son of Aphrodite whose arrows cause desire, and the husband of Psyche."},{"n":"Erotes","of":"love and desire","d":"The winged gods of love who attend Aphrodite, among them Eros, Anteros, Himeros and Pothos."},{"n":"Eucleia","of":"good reputation, glory, and honorable conduct","d":"Spirit of good repute and glory, honoured at Athens with a temple after the victory at Marathon."},{"n":"Eunomia","of":"good order, lawful conduct, and governance","d":"One of the Horae, daughter of Zeus and Themis."},{"n":"Euphrosyne","of":"joy, mirth, and good cheer","d":"One of the three Graces, daughters of Zeus and Eurynome."},{"n":"Eurus","of":"the east or southeast wind","d":"One of the four wind gods. The east wind, linked with autumn."},{"n":"Eurybia","of":"mastery of the sea, winds, and constellations","d":"Daughter of Pontus and Gaia, said to have a heart of flint. Wife of the Titan Crius."},{"n":"Eurynome","of":"water meadows and pasturelands","d":"An Oceanid Titaness and mother of the three Graces by Zeus. She and Thetis sheltered Hephaestus when he was thrown from Olympus."},{"n":"Euterpe","of":"music and lyric poetry","d":"One of the nine Muses, \"the giver of delight\", shown with the double flute."},{"n":"Gaia","of":"the Earth, land, fertility, and motherhood","d":"Primordial mother Earth. She bore the sky, the mountains and the sea, and with Uranus she bore the Titans."},{"n":"Galatea","of":"calm seas and sea life","d":"A Nereid loved by the Cyclops Polyphemus, though she loved the shepherd Acis."},{"n":"Ganymede","of":"cupbearer of the gods","d":"A Trojan prince carried up to Olympus by the eagle of Zeus to pour nectar for the gods. He is the constellation Aquarius."},{"n":"Geras","of":"old age","d":"Spirit of old age and son of Nyx, shown as a tiny, shrivelled old man."},{"n":"Glaucus","of":"the sea, fishermen, and sea prophecy","d":"A fisherman who ate a magical herb and became an immortal sea god with a fish's tail. He gives prophecies to sailors."},{"n":"Hades","of":"the Underworld, the dead, and hidden wealth beneath the earth","d":"Brother of Zeus and Poseidon and king of the Underworld. He owns a helm of invisibility, and carried off Persephone to be his queen."},{"n":"Harmonia","of":"harmony, concord, and marital unity","d":"Daughter of Ares and Aphrodite and wife of Cadmus of Thebes. Her wedding necklace brought misfortune to everyone who owned it."},{"n":"Hebe","of":"youth and the prime of life","d":"Daughter of Zeus and Hera and cupbearer to the gods, who served them nectar and ambrosia. Wife of Heracles."},{"n":"Hecate","of":"magic, witchcraft, crossroads, ghosts, night, and boundaries","d":"Torch-bearing daughter of the Titans Perses and Asteria. Zeus gave her a share of earth, sea and sky, and she helped Demeter search for Persephone."},{"n":"Hedone","of":"pleasure and delight","d":"Daughter of Eros and Psyche."},{"n":"Helios","of":"the sun, sight, and oaths","d":"The Titan who drives the chariot of the sun across the sky each day, and who sees everything that happens beneath it."},{"n":"Hemera","of":"the day and daylight","d":"Primordial goddess of day and daughter of Erebus and Nyx. She and her mother pass each other at the gates of Tartarus every dawn and dusk."},{"n":"Hephaestus","of":"fire, metalworking, smithing, craftsmanship, and volcanoes","d":"Olympian smith of the gods, lame and married to Aphrodite. He forged the weapons and palaces of Olympus."},{"n":"Hera","of":"marriage, queenship, women, family, and childbirth","d":"Queen of the gods, wife and sister of Zeus. The peacock and the cow are sacred to her, and she is known for her anger at Zeus's lovers."},{"n":"Heracles","of":"strength, heroes and athletes","d":"Son of Zeus and the mortal Alcmene. After his twelve labours he was taken up to Olympus, made a god and married to Hebe."},{"n":"Hermaphroditus","of":"androgyny, union of sexes, and marriage","d":"Child of Hermes and Aphrodite, joined into one body with the nymph Salmacis."},{"n":"Hermes","of":"travel, trade, thieves, messages, boundaries, luck, and eloquence","d":"Olympian messenger, son of Zeus and Maia. He guides souls to the Underworld, and carries winged sandals and the herald's staff."},{"n":"Hesperides","of":"the evening and the golden light of sunset","d":"The nymphs who tend the garden of golden apples at the western edge of the world."},{"n":"Hesperus","of":"the evening star","d":"The planet Venus in the evening sky, a son of Eos."},{"n":"Hestia","of":"the hearth, home, domestic life, and sacred fire","d":"Eldest child of Cronus and Rhea. A virgin goddess who received the first share of every sacrifice."},{"n":"Himeros","of":"sexual desire and longing","d":"One of the Erotes, the winged gods of love. He and Eros attended Aphrodite from the moment of her birth."},{"n":"Homonoia","of":"concord and unity of mind","d":"Spirit of agreement among citizens, and the opposite of Eris."},{"n":"Horae","of":"the seasons and the order of time","d":"Daughters of Zeus and Themis who guard the gates of Olympus: Dike, Eunomia and Eirene. At Athens they were Thallo, Auxo and Carpo."},{"n":"Horkos","of":"oaths and punishment for perjury","d":"Spirit of oaths and son of Eris. He punishes anyone who swears falsely."},{"n":"Hybris","of":"insolence, outrage, and excessive pride","d":"Spirit of insolence and arrogance toward gods and men."},{"n":"Hygieia","of":"health, cleanliness, and prevention of disease","d":"Daughter of Asclepius, shown feeding a snake from a bowl. The word hygiene comes from her name."},{"n":"Hymenaios","of":"marriage, weddings, and wedding songs","d":"The god called on in every wedding song. One of the Erotes, shown carrying a bridal torch."},{"n":"Hyperion","of":"heavenly light, watchfulness, and the cycles of sun and moon","d":"Titan, husband of Theia and father of Helios, Selene and Eos."},{"n":"Hypnos","of":"sleep","d":"God of sleep, son of Nyx and twin of Thanatos. He once put Zeus himself to sleep as a favour to Hera."},{"n":"Iacchus","of":"ritual procession, ecstatic celebration, and the Eleusinian Mysteries","d":"The torch-bearing god hailed in the procession of the Eleusinian Mysteries, often identified with Dionysus."},{"n":"Iapetus","of":"mortality, human lifespan, and the mortal condition","d":"Titan and father of Atlas, Prometheus, Epimetheus and Menoetius."},{"n":"Iaso","of":"recuperation and recovery from illness","d":"Daughter of Asclepius and Epione, and one of the goddesses of healing."},{"n":"Inachus","of":"the Inachus River and freshwater","d":"River god and first king of Argos. Father of Io."},{"n":"Iris","of":"the rainbow, divine messages, and communication","d":"Golden-winged goddess of the rainbow, daughter of Thaumas and messenger of the Olympians, above all of Hera."},{"n":"Kairos","of":"the opportune moment and the right time to act","d":"Spirit of opportunity, shown with winged feet and a single lock of hair at the front, to be seized as he runs past."},{"n":"Keres","of":"violent death, doom, and battlefield slaughter","d":"Female death spirits, daughters of Nyx, who haunt battlefields."},{"n":"Lachesis","of":"measuring the thread of life and allotting destiny","d":"One of the three Fates. She measures out the length of each life's thread."},{"n":"Lelantos","of":"stealth, concealment, and moving unseen","d":"A Titan of the air and father of Aura."},{"n":"Lethe","of":"forgetfulness and oblivion","d":"A spirit and a river of the Underworld. The dead drink her waters to forget their former lives."},{"n":"Leto","of":"motherhood and protection of the young","d":"Titaness, daughter of Coeus and Phoebe. Hunted by Hera, she gave birth to Apollo and Artemis on the island of Delos."},{"n":"Leucothea","of":"the sea and protection of sailors in distress","d":"\"The white goddess\". Once the mortal queen Ino, she leapt into the sea and became a goddess, and saved Odysseus from drowning with her veil."},{"n":"Limos","of":"famine, hunger, and starvation","d":"Spirit of famine and child of Eris."},{"n":"Lyssa","of":"mad rage, frenzy, and rabies","d":"Spirit of mad rage and daughter of Nyx. She drove Heracles to madness."},{"n":"Macaria","of":"blessed death and a peaceful afterlife","d":"Said to be a daughter of Hades."},{"n":"Mania","of":"madness, frenzy, and insanity","d":"Spirit of madness, worshipped in the plural as the Maniae."},{"n":"Megaera","of":"jealous rage and punishment of infidelity","d":"One of the three Furies. Her name means \"the grudging one\"."},{"n":"Melinoe","of":"ghosts, nightmares, and restless spirits","d":"An Underworld goddess of the Orphic hymns, daughter of Persephone. She comes to mortals at night in strange shapes and drives them mad with fear."},{"n":"Melpomene","of":"tragedy","d":"One of the nine Muses, shown with a tragic mask."},{"n":"Menoetius","of":"violent anger and rash action","d":"Titan and son of Iapetus, struck down by the thunderbolt of Zeus in the war with the Titans."},{"n":"Methe","of":"drunkenness","d":"A nymph in the company of Dionysus."},{"n":"Metis","of":"wisdom, cunning, counsel, and deep thought","d":"Titaness of wise counsel and first wife of Zeus. He swallowed her, and Athena was later born from his head."},{"n":"Mnemosyne","of":"memory and remembrance","d":"Titaness of memory, and mother of the nine Muses by Zeus."},{"n":"Moirai","of":"fate and the destinies of mortals","d":"The three Fates: Clotho, Lachesis and Atropos, who spin, measure and cut the thread of every life."},{"n":"Momus","of":"mockery, blame, criticism, and satire","d":"Spirit of mockery and fault-finding and son of Nyx, thrown out of Olympus for criticising the gods."},{"n":"Moros","of":"doom","d":"Son of Nyx, and the spirit that drives every mortal toward their fated end."},{"n":"Morpheus","of":"dreams that take human form","d":"Leader of the Oneiroi and son of Hypnos. He appears in dreams in the shape of any person."},{"n":"Muses","of":"the arts and sciences","d":"The nine daughters of Zeus and Mnemosyne, led by Apollo, who inspire poets, musicians and scholars."},{"n":"Nemesis","of":"divine retribution, balance, and punishment of arrogance","d":"Goddess of retribution and daughter of Nyx. She brings down those who grow too proud, as she did Narcissus."},{"n":"Nephele","of":"clouds","d":"A cloud nymph shaped by Zeus in the likeness of Hera. Mother of the centaurs, and of Phrixus and Helle."},{"n":"Nereids","of":"the beauty and kindness of the sea","d":"The fifty daughters of Nereus and Doris, sea nymphs who come to the aid of sailors. Thetis, Amphitrite and Galatea are among them."},{"n":"Nereus","of":"the sea, gentle waters, truth, and prophecy","d":"The Old Man of the Sea, son of Pontus and Gaia. A truthful shape-shifter and father of the fifty Nereids."},{"n":"Nike","of":"victory","d":"Winged goddess of victory, daughter of Pallas and Styx, who stands at the side of Zeus."},{"n":"Notus","of":"the south wind and late-summer storms","d":"One of the four wind gods. The south wind, bringer of the storms of late summer and autumn."},{"n":"Nyx","of":"the night","d":"Primordial goddess of night, born of Chaos. Mother of Sleep, Death and many other spirits, and feared even by Zeus."},{"n":"Oceanids","of":"springs, streams and clouds","d":"The three thousand daughters of Oceanus and Tethys."},{"n":"Oceanus","of":"the world-encircling river and freshwater","d":"Eldest of the Titans, and the great river that circles the world. With Tethys he fathered the river gods and the Oceanids."},{"n":"Oizys","of":"misery, anxiety, grief, and distress","d":"Spirit of misery and woe, daughter of Nyx."},{"n":"Oneiroi","of":"dreams","d":"The dark-winged spirits of dreams. True dreams pass through a gate of horn and false ones through a gate of ivory."},{"n":"Ourea","of":"mountains and rocky highlands","d":"The primordial gods of the mountains, children of Gaia."},{"n":"Paean","of":"physician of the gods","d":"The healer who treated the wounds of Ares and Hades in the Iliad. His name became a title of Apollo and a word for a hymn of thanks."},{"n":"Palaemon","of":"harbors, sailors, and protection at sea","d":"Once the boy Melicertes, son of Ino. He became a sea god who rides a dolphin, and the Isthmian Games were held in his honour."},{"n":"Pallas","of":"warcraft and battle","d":"Titan, son of Crius and Eurybia. Husband of Styx and father of Nike, Zelus, Cratus and Bia."},{"n":"Pan","of":"the wild, shepherds, flocks, rustic music, and panic","d":"Goat-legged god of Arcadia and son of Hermes, who plays the reed pipes. His sudden shout causes panic."},{"n":"Panacea","of":"universal remedies and cures","d":"Daughter of Asclepius and Epione. Her name means \"cure-all\"."},{"n":"Pasithea","of":"rest and relaxation","d":"One of the younger Graces, promised by Hera as a wife to Hypnos."},{"n":"Peitho","of":"persuasion, seduction, and charming speech","d":"Goddess of persuasion and attendant of Aphrodite."},{"n":"Peneus","of":"the Peneus River and freshwater","d":"River god of Thessaly and father of the nymph Daphne."},{"n":"Penthos","of":"grief, mourning, and sorrow","d":"Spirit of grief, who is said to visit those who mourn."},{"n":"Persephone","of":"the Underworld, spring growth, vegetation, and rebirth","d":"Daughter of Zeus and Demeter. Carried off by Hades, she spends part of each year as queen of the Underworld, and her return brings the spring."},{"n":"Perses","of":"destruction and ruin","d":"Titan, son of Crius and Eurybia, and father of Hecate by Asteria."},{"n":"Phanes","of":"creation, procreation, and the emergence of life","d":"The first-born god of light in Orphic myth, hatched from the cosmic egg."},{"n":"Phantasos","of":"surreal dreams and dreams of inanimate things","d":"One of the Oneiroi. He appears in dreams as lifeless things: earth, rock, water and wood."},{"n":"Pheme","of":"fame, rumor, gossip, and public reputation","d":"Spirit of rumour and report, who repeats whatever she hears, first in a whisper and then louder."},{"n":"Philotes","of":"affection, friendship, intimacy, and sexual union","d":"Spirit of affection and daughter of Nyx."},{"n":"Phobetor (Icelus)","of":"nightmares and dreams of animals and monsters","d":"One of the Oneiroi. He appears in dreams in the shape of beasts."},{"n":"Phobos","of":"fear and panic in battle","d":"Son of Ares and Aphrodite and twin of Deimos. He rides into battle beside his father."},{"n":"Phoebe","of":"bright intellect, prophecy, and the Delphic oracle","d":"Titaness, wife of Coeus and grandmother of Apollo and Artemis. She held the oracle at Delphi before giving it to Apollo."},{"n":"Phorcys","of":"hidden dangers of the deep sea","d":"An old sea god, son of Pontus and Gaia. With Ceto he fathered the Gorgons and the Graeae."},{"n":"Plutus","of":"wealth, riches, and agricultural abundance","d":"God of wealth and son of Demeter. Zeus blinded him so that he would hand out riches without regard to merit."},{"n":"Poine","of":"punishment, vengeance, and recompense","d":"Spirit of retribution for murder."},{"n":"Polyhymnia","of":"sacred poetry, hymns, meditation, and eloquence","d":"One of the nine Muses, shown veiled and deep in thought."},{"n":"Ponos","of":"toil, hard labor, and hardship","d":"Spirit of toil and son of Eris."},{"n":"Pontus","of":"the sea","d":"Primordial god of the sea, born of Gaia. Father of Nereus, Thaumas, Phorcys, Ceto and Eurybia."},{"n":"Poseidon","of":"the sea, earthquakes, horses, and storms","d":"Olympian brother of Zeus and Hades. He carries the trident and is called the Earth-shaker."},{"n":"Pothos","of":"yearning, longing, and desire for what is absent","d":"One of the Erotes, the winged gods of love."},{"n":"Priapus","of":"fertility, gardens, livestock, and male sexuality","d":"A rustic fertility god, son of Aphrodite, whose statues guarded gardens and orchards."},{"n":"Prometheus","of":"forethought, fire, craft, and human progress","d":"The Titan who stole fire for mankind. Zeus chained him to a rock where an eagle ate his liver each day, until Heracles set him free."},{"n":"Proteus","of":"the sea, prophecy, and change","d":"An Old Man of the Sea who herds Poseidon's seals. He changes shape to escape, and prophesies only for those who can hold him fast."},{"n":"Psyche","of":"the soul and breath of life","d":"A mortal princess loved by Eros. After the trials set for her by Aphrodite she was made immortal, and is shown with butterfly wings."},{"n":"Rhea","of":"motherhood, fertility, generation, and mountain wilds","d":"Titaness, wife of Cronus and mother of Zeus, Hera, Poseidon, Hades, Demeter and Hestia. She saved Zeus by giving Cronus a stone to swallow instead."},{"n":"Scamander","of":"the Scamander River and freshwater","d":"River god of the plain of Troy, who rose up to fight Achilles in the Iliad."},{"n":"Selene","of":"the moon","d":"The Titaness who drives the chariot of the moon. She loved the sleeping shepherd Endymion."},{"n":"Silenus","of":"wine-making and drunken wisdom","d":"Oldest of the satyrs and the tutor and companion of Dionysus."},{"n":"Soteria","of":"safety, deliverance, preservation, and protection from harm","d":"Spirit of safety and deliverance from harm."},{"n":"Styx","of":"the river Styx and unbreakable oaths","d":"An Oceanid Titaness and the Underworld river that bears her name. She was first to side with Zeus against the Titans, so the gods swear their binding oaths by her waters."},{"n":"Tartarus","of":"the abyss beneath the Underworld and divine imprisonment","d":"The primordial pit far beneath the Underworld, where the Titans are imprisoned. Father of the monster Typhon."},{"n":"Telesphorus","of":"convalescence and recovery from illness","d":"A small, hooded boy god, companion of Asclepius and Hygieia."},{"n":"Terpsichore","of":"dance and choral song","d":"One of the nine Muses, shown dancing with a lyre."},{"n":"Tethys","of":"freshwater, nourishing waters, and the nursing of life","d":"Titaness and wife of Oceanus. Mother of the river gods and the three thousand Oceanids."},{"n":"Thalassa","of":"the sea and seawater","d":"The primordial spirit of the sea itself, and the female counterpart of Pontus."},{"n":"Thalia (Grace)","of":"festivity, abundance, and good cheer","d":"One of the three Graces, who presides over banquets and celebrations."},{"n":"Thalia (Muse)","of":"comedy and pastoral poetry","d":"One of the nine Muses, shown with a comic mask and a shepherd's crook."},{"n":"Thallo","of":"spring, budding plants, and new growth","d":"One of the Seasons honoured at Athens, bringing the buds of spring."},{"n":"Thanatos","of":"peaceful death","d":"God of death, son of Nyx and twin of Hypnos. He brings the gentle death, unlike the violent Keres."},{"n":"Thaumas","of":"the wonders and marvels of the sea","d":"An old sea god, son of Pontus and Gaia. Father of Iris and the Harpies."},{"n":"Theia","of":"sight, shining light, brilliance, and precious metals","d":"Titaness, wife of Hyperion and mother of Helios, Selene and Eos. She gave gold and gems their shine."},{"n":"Themis","of":"divine law, order, custom, and prophecy","d":"Titaness and second wife of Zeus. Mother of the Horae and, in some accounts, of the Fates."},{"n":"Thetis","of":"the sea and protection of sailors","d":"A Nereid and the mother of Achilles. It was foretold that her son would be greater than his father."},{"n":"Tisiphone","of":"punishment of murder and blood crimes","d":"One of the three Furies. Her name means \"avenger of murder\"."},{"n":"Triptolemus","of":"agriculture, grain cultivation, and farming","d":"A prince of Eleusis whom Demeter taught to farm. He flew across the world in a winged chariot, sowing grain."},{"n":"Triton","of":"the sea, waves, and heralding Poseidon's commands","d":"Son of Poseidon and Amphitrite, a merman who blows a conch shell."},{"n":"Tyche","of":"fortune, chance, prosperity, and the fate of cities","d":"Goddess of fortune, shown with a rudder and a horn of plenty, and wearing a crown of city walls."},{"n":"Urania","of":"astronomy and celestial knowledge","d":"One of the nine Muses, shown with a globe and a compass."},{"n":"Uranus","of":"the sky and heavens","d":"The primordial sky, son and husband of Gaia and father of the Titans. He was overthrown by his son Cronus."},{"n":"Zagreus","of":"rebirth","d":"In Orphic myth, a son of Zeus and Persephone who was torn apart by the Titans and born again as Dionysus."},{"n":"Zelus","of":"zeal, rivalry, emulation, and dedication","d":"Son of Pallas and Styx and brother of Nike, Cratus and Bia."},{"n":"Zephyrus","of":"the west wind and spring","d":"One of the four wind gods. The gentle west wind and messenger of spring, husband of Chloris."},{"n":"Zeus","of":"the sky, thunder, lightning, kingship, law, justice, and hospitality","d":"King of the gods and son of Cronus and Rhea. He rules from Mount Olympus, with the thunderbolt, the eagle and the oak as his symbols."}];
function viewGods() {
  // two separate searches: one looks only at names, the other only at what they preside over; both can be used together
  const qn = (ui.q.godName || '').trim().toLowerCase(), qo = (ui.q.godOf || '').trim().toLowerCase(), any = qn || qo;
  // a domain matches where a word starts with what was typed, so "sea" finds the sea but not "disease"
  const startsWord = (text, q) => { for (let i = text.indexOf(q); i !== -1; i = text.indexOf(q, i + 1)) if (i === 0 || !/[a-z]/.test(text[i - 1])) return true; return false; };
  const list = PANTHEON.filter(g => (!qn || g.n.toLowerCase().includes(qn)) && (!qo || startsWord(g.of.toLowerCase(), qo)));
  // names that start with what was typed come first
  if (qn) list.sort((a, b) => (a.n.toLowerCase().startsWith(qn) ? 0 : 1) - (b.n.toLowerCase().startsWith(qn) ? 0 : 1));
  return head('Pantheon', `${PANTHEON.length} Greek gods, goddesses, Titans and spirits, for naming rooms, events and drinks. Each one shows what they preside over and who they are.`)
    + `<div class="row searches"><input class="field search" type="search" data-q="godName" data-fk="q:godName" value="${esc(ui.q.godName || '')}" placeholder="Search by name" aria-label="Search the pantheon by name"><input class="field search" type="search" data-q="godOf" data-fk="q:godOf" value="${esc(ui.q.godOf || '')}" placeholder="Search by domain, like wine or the sea" aria-label="Search the pantheon by domain"></div>`
    + (list.length ? `${any ? `<p class="note" style="margin:0 0 12px">${list.length} of ${PANTHEON.length} match.</p>` : ''}<ul class="gods">${list.map(g => `<li><b>${esc(g.n)}</b><span class="of">${esc(g.of.charAt(0).toUpperCase() + g.of.slice(1))}</span><span>${esc(g.d)}</span></li>`).join('')}</ul>`
      : `<p class="empty">Nobody in the pantheon matches ${qn && qo ? 'both searches' : 'that search'}.</p>`);
}

function axisFmt(v) { const a = Math.abs(v); return a >= 1e6 ? (Math.round(v / 1e5) / 10) + 'm' : a >= 1e3 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v)); }
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

  const stacks = labels.map((_, i) => { let p = 0, q = 0; for (const s of series) { const v = s.values[i]; if (!isNum(v)) continue; if (v >= 0) p += v; else q += v; } hi = Math.max(hi, p); lo = Math.min(lo, q); return {p, q}; });
  if (hi === 0 && lo === 0) hi = 1;
  const step = o.whole ? Math.max(1, niceStep((hi - lo) / 4)) : niceStep((hi - lo) / 4), top = Math.ceil(hi / step) * step, bot = Math.floor(lo / step) * step;
  const y = v => T + (top - v) / (top - bot) * (H - T - B), f1 = x => x.toFixed(1);
  let g = '';
  for (let k = 0, nT = Math.round((top - bot) / step); k <= nT; k++) { const v = bot + k * step; g += `<line class="${v === 0 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text x="${L - 6}" y="${f1(y(v) + 4)}" text-anchor="end">${axisFmt(v)}</text>`; }
  const bw = Math.min(44, band * 0.62), every = Math.ceil(40 / band);
  labels.forEach((lab, i) => {
    const cx = L + band * i + band / 2; let p = 0, q = 0;
    for (const s of series) {
      const v = s.values[i]; if (!isNum(v) || v === 0) continue;
      const a = v >= 0 ? p : q, b = a + v; if (v >= 0) p = b; else q = b;
      g += `<rect class="${s.cls}" x="${f1(cx - bw / 2)}" y="${f1(y(Math.max(a, b)))}" width="${f1(bw)}" height="${f1(Math.max(Math.abs(y(a) - y(b)), 1))}" rx="2"><title>${esc(lab)} ${esc(s.name)}: ${fmtNum(v)}${unit}</title></rect>`;
    }
    const st = stacks[i];
    if (band >= 40 && (st.p || st.q)) g += `<text x="${f1(cx)}" y="${f1(y(Math.max(st.p, 0)) - 5)}" text-anchor="middle">${o.top ? esc(o.top(i)) : axisFmt(st.p + st.q)}</text>`;
    if (i % every === 0) g += `<text x="${f1(cx)}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<div class="chart">${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg></div>`;
}
const cells = (...xs) => xs.map(x => Array.isArray(x) ? `<td class="num">${x[0]}</td>` : `<td class="pad">${x}</td>`).join('');
const sumBy = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);

function nightDetail(n) {
  const at = sec => sec && isNum(sec.loggedAt) ? `<span>logged ${fmtClock(sec.loggedAt)} ${new Intl.DateTimeFormat('en-US', {timeZone: tz(), month: 'numeric', day: 'numeric'}).format(new Date(sec.loggedAt))}</span>` : '';
  let h = `<div class="detail"><h3 style="margin:0">${nightLabel(n.id)}${n.collab ? ' <span class="ctag">Collab night</span>' : ''}</h3>`;
  if (n.reception) { const r = n.reception;
    h += `<h4>Reception ${at(r)}</h4><p class="note" style="margin:0 0 8px">${r.receptionist ? 'Receptionist ' + esc(r.receptionist) + '. ' : ''}Bookings total ${gil(r.total)}, reception bonus ${gil(r.bonus)}.</p>`
      + (pats => table(['Employee', ...(pats ? ['Patron'] : []), 'RP type', ['Hours', 'num'], ['Guests', 'num'], 'VIP', 'Location', ['Total', 'num']],
          (r.bookings || []).map(b => `<tr>${cells(esc(b.employee) || 'Room only', ...(pats ? [esc(b.patron || '')] : []), esc(b.rpType), [fmtNum(b.duration)], [fmtNum(b.guests)], b.vip ? 'Yes' : '', esc(b.location), [gil(b.total)])}</tr>`).join(''), pats ? 760 : 640, ''))((r.bookings || []).some(b => b.patron)); }
  if (n.raffle) { const r = n.raffle;
    h += `<h4>Raffle ${at(r)}</h4><p class="note" style="margin:0 0 8px">${fmtNum(r.tickets)} tickets, pot ${gil(r.total)}. Winner ${gil(r.winnerCut)}, club ${gil(r.clubCut)}.</p>`
      + table(['Patron', 'World', ['Tickets', 'num'], ['Cost', 'num'], 'Money taken by', 'Paid'],
          (r.entries || []).map(e => `<tr>${cells(esc(e.patron), esc(e.world), [fmtNum(e.tickets)], [gil(e.cost)], esc(e.takenBy), e.paid ? 'Yes' : 'No')}</tr>`).join(''), 560, ''); }
  if (n.casino) { const c = n.casino;
    h += `<h4>Casino ${at(c)}</h4>` + table(['Shift', ['Gross profit', 'num'], ['Dealer pool', 'num'], 'Dealers'],
          [1, 2].map(k => `<tr>${cells('Shift ' + k, [gil(c['s' + k + 'Gross'])], [gil(c['s' + k + 'Pool'])], esc((c['s' + k + 'Dealers'] || []).join(', ')))}</tr>`).join('')
          + `<tr class="sum">${cells('Night', [gil(c.gross)], [gil(c.payouts)], 'Apollo retained ' + gil(c.retained))}</tr>`, 520, ''); }
  if (n.staff) { const t = n.staff;
    h += `<h4>HR ${at(t)}</h4>` + (isNum(t.collabRate) ? `<p class="note" style="margin:0 0 8px">Hourly pay was ${fmtRate(t.collabRate)} the usual rate for the collab night.</p>` : '') + table(['Employee', 'Job', ['Hours', 'num'], ['Promotion', 'num'], ['Pay', 'num'], 'Paid'],
          (t.rows || []).map(r => `<tr>${cells(esc(r.name), esc(r.job), [isNum(r.hours) ? r.hours.toFixed(2) : ''], [r.promoPay ? gil(r.promoPay) : ''], [r.infinite ? 'Infinite' : gil(r.pay)], r.paid ? 'Yes' : 'No')}</tr>`).join('')
          + `<tr class="sum">${cells('Total', '', [isNum(t.hours) ? t.hours.toFixed(2) : ''], [gil((t.rows || []).reduce((a, r) => a + (r.promoPay || 0), 0)) || ''], [gil(t.payTotal)], '')}</tr>`, 620, 'Nobody had both a time in and a time out, so no pay was logged.');
    if (Array.isArray(t.roster)) {
      const ro = attendance(t), showed = ro.filter(r => r.showed), missed = ro.filter(r => !r.showed && !onLeave(r)), leave = ro.filter(r => !r.showed && onLeave(r));
      h += `<p class="note" style="margin:10px 0 0;max-width:none"><b>${showed.length} of ${showed.length + missed.length} showed up.</b> ${showed.length ? 'Showed: ' + esc(showed.map(r => r.name).join(', ')) + '. ' : ''}${missed.length ? 'Did not show: ' + esc(missed.map(r => r.name).join(', ')) + '. ' : ''}${leave.length ? 'On leave: ' + esc(leave.map(r => r.name).join(', ')) + '.' : ''}${n.collab ? ' A collab night, so no missed days were added.' : ''}</p>`;
    } }
  if (n.bar) h += barNightDetail(n.bar, at);
  return h + '</div>';
}

function viewData() {
  const every = state.nights.filter(n => n.reception || n.raffle || n.casino || n.staff || n.bar), collabs = every.filter(n => n.collab);
  if (!collabs.length) ui.dataKind = 'regular';
  const kind = ui.dataKind === 'collab' ? 'collab' : 'regular', all = every.filter(n => !!n.collab === (kind === 'collab'));
  const kinds = collabs.length ? `<div class="kinds" role="group" aria-label="Which nights to show">${[['regular', 'Regular nights', every.length - collabs.length], ['collab', 'Collab nights', collabs.length]].map(([k, l, c]) => `<button type="button" data-act="data-kind" data-which="${k}" aria-pressed="${kind === k}">${l}<span class="cnt">${c}</span></button>`).join('')}</div>` : '';
  if (kind === 'collab') return viewDataNights(all, kinds, 'Nights logged while Collab night was switched on, with pay at the collab rate. They are kept apart from the regular nights, and the trends below count only collab nights.', 'collab');
  return viewDataNights(all, kinds, 'Each Sunday, press Log to Data on Reception, Raffle, Casino, Bar, and HR' + (me.admin ? ', or press Log the night on your profile to log them all at once' : '') + '. Every logged night is kept here and feeds the trends below.' + (collabs.length ? ' Collab nights are kept apart, under Collab nights.' : ''), collabs.length ? 'regular' : 'logged');
}
function viewDataNights(all, kinds, sub, word) {
  if (!all.length) return head('Data', sub) + kinds + `<div class="scroll"><p class="empty">No nights logged yet. Open Reception, Raffle, Casino, Bar, or HR and press Log to Data to record tonight.</p></div>`;
  const none = '<td class="pad muted">not logged</td>';
  const logRows = all.slice().reverse().map(n => {
    const r = n.reception, f = n.raffle, c = n.casino, t = n.staff, bb = n.bar, key = 'night-del:' + n.id, on = ui.confirm === key;
    return `<tr>
      <td class="pad stick"><b>${nightLabel(n.id)}</b></td>
      ${r ? `<td class="pad">${(r.bookings || []).length} for ${gil(r.total)}</td>` : none}
      ${f ? `<td class="pad">${fmtNum(f.tickets)} tickets, ${gil(f.total)} pot</td>` : none}
      ${c ? `<td class="pad">${gil(c.gross)} gross, ${gil(c.retained)} kept</td>` : none}
      ${t ? `<td class="pad">${attendance(t).filter(x => x.showed).length} showed up, ${gil(t.payTotal)} pay</td>` : none}
      ${bb ? `<td class="pad">${bb.count} buyout${bb.count === 1 ? '' : 's'}, ${gil(bb.total)}</td>` : none}
      <td class="pad"><button type="button" class="btn sm" data-act="night-view" data-id="${n.id}" aria-expanded="${ui.openNight === n.id}">${ui.openNight === n.id ? 'Hide' : 'View'}</button></td>
      <td class="c"><button type="button" class="x${on ? ' on' : ''}" data-act="night-del" data-id="${n.id}" data-confirm="${key}" aria-label="Remove the log for ${nightLabel(n.id)}"${dis()}>${on ? 'Remove?' : '×'}</button></td></tr>`;
  }).join('');
  const open = ui.openNight && all.find(n => n.id === ui.openNight);

  const ns = ui.range === 'all' ? all : all.slice(-Number(ui.range));
  const lab = n => nightLabel(n.id, true);
  const emptyTrend = what => `<div class="scroll"><p class="empty">No ${what} logged in these nights yet.</p></div>`;

  // casino
  const cs = ns.filter(n => n.casino);
  const casino = !cs.length ? emptyTrend('casino nights') : `<div class="split">
      ${barChart('Casino profit per night', cs.map(lab), [{name: 'Apollo retained', cls: 'k1', values: cs.map(n => n.casino.retained)}, {name: 'Dealer payouts', cls: 'k2', values: cs.map(n => n.casino.payouts)}])}
      ${table(['Night', ['Gross profit', 'num'], ['Dealer payouts', 'num'], ['Apollo retained', 'num']],
        cs.slice().reverse().map(n => `<tr>${cells(nightLabel(n.id), [gil(n.casino.gross)], [gil(n.casino.payouts)], [gil(n.casino.retained)])}</tr>`).join('')
        + `<tr class="sum">${cells('Total', [gil(sumBy(cs, n => n.casino.gross))], [gil(sumBy(cs, n => n.casino.payouts))], [gil(sumBy(cs, n => n.casino.retained))])}</tr>`
        + `<tr class="sum">${cells('Average a night', [gil(sumBy(cs, n => n.casino.gross) / cs.length)], [gil(sumBy(cs, n => n.casino.payouts) / cs.length)], [gil(sumBy(cs, n => n.casino.retained) / cs.length)])}</tr>`, 460, '')}
    </div>`;

  // staff pay
  const ss = ns.filter(n => n.staff);
  let staff = emptyTrend('staff pay');
  if (ss.length) {
    const by = new Map();
    for (const n of ss) for (const r of n.staff.rows || []) {
      const e = by.get(r.name) || {name: r.name, job: r.job, nights: 0, hours: 0, pay: 0, infinite: false};
      e.job = r.job || e.job; e.nights++; e.hours += r.hours || 0; e.pay += r.pay || 0; e.infinite = e.infinite || !!r.infinite; by.set(r.name, e);
    }
    const list = [...by.values()].sort((a, b) => b.pay - a.pay || b.hours - a.hours);
    staff = `<div class="split">
      ${barChart('Staff pay per night', ss.map(lab), [{name: 'Staff pay', cls: 'k1', values: ss.map(n => n.staff.payTotal)}])}
      ${table(['Employee', 'Job', ['Nights', 'num'], ['Hours', 'num'], ['Total pay', 'num'], ['Average a night', 'num']],
        list.map(e => `<tr>${cells(esc(e.name), esc(e.job), [e.nights], [e.hours.toFixed(2)], [e.infinite && !e.pay ? 'Infinite' : gil(e.pay)], [e.infinite && !e.pay ? '' : gil(e.pay / e.nights)])}</tr>`).join('')
        + `<tr class="sum">${cells('Total', '', [ss.length], [sumBy(ss, n => n.staff.hours).toFixed(2)], [gil(sumBy(ss, n => n.staff.payTotal))], [gil(sumBy(ss, n => n.staff.payTotal) / ss.length)])}</tr>`, 560, '')}
    </div>`;
  }

  // attendance
  let attend = emptyTrend('staff nights');
  if (ss.length) {
    const by = new Map();
    ss.forEach((n, i) => {
      for (const r of attendance(n.staff)) {
        const e = by.get(r.name) || {name: r.name, job: r.job, showed: 0, missed: 0, marks: {}};
        e.job = r.job || e.job;
        if (r.showed) e.showed++; else if (!onLeave(r)) e.missed++;
        e.marks[i] = r.showed ? 's' : onLeave(r) ? 'l' : 'm';
        by.set(r.name, e);
      }
    });
    const recent = ss.map((_, i) => i).slice(-8), sym = {s: '●', m: '○', l: '–'}, word = {s: 'showed up', m: 'did not show', l: 'on leave'};
    const list = [...by.values()].sort((a, b) => b.missed - a.missed || a.showed - b.showed || a.name.localeCompare(b.name));
    const showedOn = n => attendance(n.staff).filter(r => r.showed).length, missedOn = n => attendance(n.staff).filter(r => !r.showed && !onLeave(r)).length;
    attend = `<div class="split">
      ${barChart('Staff attendance per night', ss.map(lab), [{name: 'Showed up', cls: 'k1', values: ss.map(showedOn)}, {name: 'Did not show', cls: 'k3', values: ss.map(missedOn)}], {unit: ' staff', whole: true, top: i => String(showedOn(ss[i]))})}
      ${table(['Employee', 'Job', ['Showed up', 'num'], ['Missed', 'num'], ['Show rate', 'num'], `Last ${recent.length} night${recent.length === 1 ? '' : 's'}, oldest first`],
        list.map(e => `<tr>${cells(esc(e.name), esc(e.job), [e.showed], [e.missed], [e.showed + e.missed ? Math.round(e.showed / (e.showed + e.missed) * 100) + '%' : ''])}<td class="pad marks" title="${esc(recent.map(i => lab(ss[i]) + ' ' + (word[e.marks[i]] || 'not on the roster')).join(', '))}">${recent.map(i => sym[e.marks[i]] || '·').join(' ')}</td></tr>`).join(''), 640, '')}
      <p class="note" style="max-width:none">● showed up, ○ did not show, – on leave, · not on the roster that night. Showing up means Clock in was ticked or a time in was entered when the night was logged. Jobs with attendance switched off in Settings, such as owners and co-owners, are left out, and anyone on LOA is not counted as missing.</p>
    </div>`;
  }

  // raffle
  const rs = ns.filter(n => n.raffle);
  let raffle = emptyTrend('raffles');
  if (rs.length) {
    const by = new Map();
    for (const n of rs) for (const e of n.raffle.entries || []) {
      const k = (e.patron || '').toLowerCase() + '|' + e.world, b = by.get(k) || {patron: e.patron, world: e.world, nights: 0, tickets: 0, spent: 0};
      b.nights++; b.tickets += e.tickets || 0; b.spent += e.cost || 0; by.set(k, b);
    }
    const buyers = [...by.values()].sort((a, b) => b.spent - a.spent).slice(0, 10);
    raffle = `<div class="split">
      ${barChart('Raffle pot per night', rs.map(lab), [{name: 'Winner payout', cls: 'k1', values: rs.map(n => n.raffle.winnerCut)}, {name: 'Club cut', cls: 'k3', values: rs.map(n => n.raffle.clubCut)}])}
      <div class="pair">${table(['Night', ['Tickets', 'num'], ['Buyers', 'num'], ['Pot', 'num'], ['Winner payout', 'num'], ['Club cut', 'num']],
        rs.slice().reverse().map(n => `<tr>${cells(nightLabel(n.id), [fmtNum(n.raffle.tickets)], [(n.raffle.entries || []).length], [gil(n.raffle.total)], [gil(n.raffle.winnerCut)], [gil(n.raffle.clubCut)])}</tr>`).join('')
        + `<tr class="sum">${cells('Total', [fmtNum(sumBy(rs, n => n.raffle.tickets))], [sumBy(rs, n => (n.raffle.entries || []).length)], [gil(sumBy(rs, n => n.raffle.total))], [gil(sumBy(rs, n => n.raffle.winnerCut))], [gil(sumBy(rs, n => n.raffle.clubCut))])}</tr>`, 600, '')}
      ${table(['Biggest buyers', 'World', ['Raffles', 'num'], ['Tickets', 'num'], ['Spent', 'num']],
        buyers.map(b => `<tr>${cells(esc(b.patron) || 'No name', esc(b.world), [b.nights], [fmtNum(b.tickets)], [gil(b.spent)])}</tr>`).join(''), 480, '')}</div>
    </div>`;
  }

  // bookings
  const bs = ns.filter(n => n.reception);
  let bookings = emptyTrend('bookings');
  if (bs.length) {
    const by = new Map();
    for (const n of bs) for (const b of n.reception.bookings || []) {
      const e = by.get(b.employee || '') || {name: b.employee || '', count: 0, nights: new Set(), hours: 0, total: 0};
      e.count++; e.nights.add(n.id); e.hours += b.duration || 0; e.total += b.total || 0; by.set(b.employee || '', e);
    }
    const list = [...by.values()].sort((a, b) => !a.name - !b.name || b.count - a.count || b.total - a.total);
    const count = sumBy(bs, n => (n.reception.bookings || []).length), total = sumBy(bs, n => n.reception.total);
    bookings = `<div class="split">
      ${barChart('Booking fees earned by staff per night', bs.map(lab), [{name: 'Booking fees earned by staff', cls: 'k1', values: bs.map(n => n.reception.total)}])}
      ${table(['Who was booked', ['Bookings', 'num'], ['Nights booked', 'num'], ['Hours', 'num'], ['Earned from bookings', 'num'], ['Average earned a booking', 'num']],
        list.map(e => `<tr>${cells(esc(e.name) || 'Room only, no staff', [e.count], [`${e.nights.size} of ${bs.length}`], [fmtNum(e.hours)], [gil(e.total)], [gil(e.total / e.count)])}</tr>`).join('')
        + `<tr class="sum">${cells('Total', [count], [bs.length], [fmtNum(sumBy(bs, n => sumBy(n.reception.bookings || [], b => b.duration)))], [gil(total)], [gil(count ? total / count : 0)])}</tr>`, 700, '')}
      <p class="note" style="max-width:none">Employees keep the whole booking fee, so these are the amounts each person earned from bookings, on top of their hourly pay.</p>
    </div>`;
  }

  const ranges = [['4', 'Last 4 nights'], ['12', 'Last 12 nights'], ['26', 'Last 26 nights'], ['all', 'Every night']];
  return head('Data', sub) + kinds
    + table([['Night', 'stick', '150px'], 'Bookings', 'Raffle', 'Casino', 'Staff', 'Bar', ['', '', '80px'], ['', '', '70px']], logRows, 1180, '')
    + (open ? nightDetail(open) : '')
    + `<div class="vh" style="margin-top:38px"><div><h2>Trends</h2><p>${ns.length === all.length ? `All ${all.length} ${word} night${all.length === 1 ? '' : 's'}` : `The last ${ns.length} of ${all.length} ${word} nights`}, ${nightLabel(ns[0].id)} to ${nightLabel(ns[ns.length - 1].id)}.</p></div>
        <div class="acts"><select class="field" style="width:auto" data-range="1" data-fk="range" aria-label="Nights to include">${ranges.map(([v, l]) => `<option value="${v}"${ui.range === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <section class="trend"><h3>Casino profits</h3>${casino}</section>
      <section class="trend"><h3>Staff pay</h3>${staff}</section>
      <section class="trend"><h3>Attendance</h3>${attend}</section>
      <section class="trend"><h3>Raffle buys and payouts</h3>${raffle}</section>
      <section class="trend"><h3>Bookings and what staff earned from them</h3>${bookings}</section>
      <section class="trend"><h3>Bar buyouts</h3>${barTrend(ns, lab, emptyTrend)}</section>`;
}

// a picture for a menu item, chosen on the Bar page: shrunk to fit and kept with the item
async function pickMenuPhoto(input) {
  const id = input.dataset.menuPhoto, file = input.files && input.files[0]; input.value = '';
  if (!file || !id || lvl('bar') < 2) return;
  if (!/^image\//.test(file.type)) { toast('Choose a picture file, such as a PNG or JPG.'); return; }
  let data = '';
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    // keep the picture's own shape, no larger than 640 pixels on its longer side (the drink cards on the Bar page show
    // it large); smaller again if it is still heavy
    for (const max of [640, 480, 360, 240]) {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'), g = c.getContext('2d');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
      // WebP keeps a see-through background; a browser that cannot write it gets a JPEG on the page's dark colour
      data = c.toDataURL('image/webp', 0.82);
      if (!data.startsWith('data:image/webp')) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#161B36'; g.fillRect(0, 0, c.width, c.height); data = c.toDataURL('image/jpeg', 0.82); }
      if (data.length < 280000) break;
    }
    URL.revokeObjectURL(url);
  } catch { toast('That picture could not be read. Try a PNG or JPG.'); return; }
  if (!data || data.length >= 280000) { toast('That picture is too detailed to store. Try a smaller or simpler one.'); return; }
  commit('menu', id, {photo: data}); toast('Picture saved. It shows on the Taverna page.');
}

/* ───────────── the venue's song ───────────── */
// The song from the venue's Carrd, played through SoundCloud's own player on Home and the venue pages. Browsers
// do not let a page start sound by itself for a first-time visitor, so it starts as soon as they click or tap
// anything; the button turns it off, and that choice is remembered on the device. It plays quietly (20%) unless
// the visitor has set the volume themselves with the slider on the music bar, which is also remembered.
const SONG_URL = 'https://soundcloud.com/lith-480765591/come-taste-the-divine';
const VOLUME_DEFAULT = 20;
let song = null, songFrame = null, songOn = false, songTried = false, songMutedFrom = null;
function songVolume() {
  try { const raw = localStorage.getItem('apollo-volume'), v = Number(raw); return raw != null && raw !== '' && v >= 0 && v <= 100 ? v : VOLUME_DEFAULT; } catch { return VOLUME_DEFAULT; }
}
function setSongVolume(v) {
  v = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
  try { localStorage.setItem('apollo-volume', String(v)); } catch { /* not remembered */ }
  if (v > 0) songMutedFrom = null;
  if (song) song.setVolume(v);
  paintVolume();
}
function paintVolume() {
  const v = songVolume(), r = $('#music-vol'), n = $('#music-vol-n'), m = $('#music-mute');
  if (r) { if (Number(r.value) !== v) r.value = v; r.setAttribute('aria-valuetext', v + '%'); }
  if (n) n.textContent = v + '%';
  if (m) { m.dataset.level = v === 0 ? 'off' : v < 50 ? 'low' : 'high'; m.setAttribute('aria-label', v === 0 ? 'Turn the music back up' : 'Mute the music'); m.setAttribute('aria-pressed', String(v === 0)); }
}
const musicWanted = () => { try { return localStorage.getItem('apollo-music') !== 'off'; } catch { return true; } };
const rememberMusic = on => { try { localStorage.setItem('apollo-music', on ? 'on' : 'off'); } catch { /* not remembered */ } };
function paintMusicButton() { const b = $('#music-btn'); if (!b) return; b.textContent = songOn ? 'Pause music' : 'Play music'; b.setAttribute('aria-pressed', String(songOn)); }
function loadSong() {
  if (songFrame) return;
  songFrame = document.createElement('iframe');
  songFrame.title = 'Come Taste the Divine, on SoundCloud'; songFrame.allow = 'autoplay'; songFrame.setAttribute('scrolling', 'no'); songFrame.setAttribute('frameborder', 'no');
  // not started by SoundCloud itself, so it never plays a moment at full volume: the page sets the volume, then plays
  songFrame.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(SONG_URL) + '&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false&color=%23e0b45a';
  $('#music-frame').appendChild(songFrame);
  const s = document.createElement('script'); s.src = 'https://w.soundcloud.com/player/api.js';
  s.onload = () => {
    if (!window.SC || !SC.Widget) { $('#music').classList.add('plain'); return; }
    const w = SC.Widget(songFrame), E = SC.Widget.Events;
    w.bind(E.READY, () => { song = w; w.setVolume(songVolume()); if (isVenue(ui.tab) && musicWanted()) w.play(); });
    w.bind(E.PLAY, () => { songOn = true; w.setVolume(songVolume()); paintMusicButton(); if (!isVenue(ui.tab)) w.pause(); });
    w.bind(E.PAUSE, () => { songOn = false; paintMusicButton(); });
    w.bind(E.FINISH, () => { songOn = false; paintMusicButton(); if (isVenue(ui.tab) && musicWanted()) { w.seekTo(0); w.play(); } });
  };
  // without SoundCloud's helper the button cannot work, so show their own small player instead
  s.onerror = () => $('#music').classList.add('plain');
  document.head.appendChild(s);
}
// called on every page change: the song belongs to the venue pages and pauses on the staff pages
function paintMusic() {
  const bar = $('#music'); if (!bar) return;
  const here = isVenue(ui.tab); bar.hidden = !here;
  if (here && musicWanted()) { loadSong(); if (song && !songOn) song.play(); }
  else if (song && songOn) song.pause();
  paintMusicButton();
}
// the volume slider on the music bar (shown when the bar is hovered or focused, and always on touch screens)
$('#music-vol').addEventListener('input', e => setSongVolume(e.target.value));
$('#music-mute').addEventListener('click', () => {
  const v = songVolume();
  if (v > 0) { setSongVolume(0); songMutedFrom = v; }
  else setSongVolume(songMutedFrom || VOLUME_DEFAULT);
});
paintVolume();
$('#music-btn').addEventListener('click', () => {
  if (songOn) { rememberMusic(false); if (song) song.pause(); }
  else { rememberMusic(true); loadSong(); if (song) song.play(); }
});
// the first click or tap anywhere on a venue page is what lets the browser start the song
document.addEventListener('pointerdown', e => {
  if (songTried || e.target.closest('#music')) return;
  songTried = true;
  if (isVenue(ui.tab) && musicWanted() && song && !songOn) song.play();
}, true);

// Apollo opens on Sundays. A buyout can only be quoted while the doors are open, and it costs the
// per-hour price from Settings for every hour left until close, with part of an hour counted as a whole one.
const OPEN_DAY = 0, OPEN_DAY_NAME = 'Sundays';
function openWindow(ms = Date.now()) {
  const cfg = state.config, start = hhmmToSec(cfg.startTime), close = hhmmToSec(cfg.closeTime);
  if (start == null || close == null) return {open: false};
  const p = venueParts(ms), dow = new Date(Date.UTC(p.y, p.mo - 1, p.d)).getUTCDay(), sec = p.h * 3600 + p.mi * 60 + p.s;
  const pastMidnight = close <= start;   // 9:00 PM to 1:00 AM runs into the next day
  let left = null;
  if (dow === OPEN_DAY && sec >= start && (pastMidnight || sec < close)) left = pastMidnight ? 86400 - sec + close : close - sec;
  else if (pastMidnight && dow === (OPEN_DAY + 1) % 7 && sec < close) left = close - sec;
  return left == null || left <= 0 ? {open: false} : {open: true, secLeft: left, hours: Math.ceil(left / 3600)};
}
const openHoursText = () => `${OPEN_DAY_NAME}, ${fmt12(state.config.startTime)} to ${fmt12(state.config.closeTime)}`;
// bartenders who are clocked in on the HR page and have not clocked out
const bartendersOn = () => hrSorted().filter(r => r.job === 'Bartender' && r.name && C.showed(r) && !r.clockOut && !isNum(r.timeOut)).map(r => r.name);
function buyoutQuote(ms = Date.now()) {
  const w = openWindow(ms); if (!w.open) return null;
  const cfg = state.config, rate = isNum(cfg.barBuyoutRate) && cfg.barBuyoutRate > 0 ? cfg.barBuyoutRate : 1e6;
  const amount = Math.ceil(w.hours * rate / 1e6) * 1e6;   // always a whole number of millions
  const share = v => isNum(v) && v >= 0 ? v : 0.5;
  const house = Math.round(amount * share(cfg.houseSplit)), pool = Math.round(amount * share(cfg.barSplit)), bartenders = bartendersOn();
  return {hours: w.hours, secLeft: w.secLeft, amount, house, pool, bartenders, each: bartenders.length ? Math.floor(pool / bartenders.length / 1000) * 1000 : null};
}
const leftText = sec => { const m = Math.ceil(sec / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
function recordBuyout() {
  if (collabOn()) { ui.buyout = false; toast('There are no bar buyouts on a collab night.'); scheduleRender(); return; }
  const q = buyoutQuote();
  if (!q) { ui.buyout = false; toast('Apollo has closed, so there is no buyout to record.'); scheduleRender(); return; }
  addRow('buyouts', {patron: String(ui.buyoutPatron || '').trim(), hours: q.hours, amount: q.amount, house: q.house, pool: q.pool, bartenders: q.bartenders, each: q.each, by: myName()});
  ui.focusNew = null; ui.buyoutPatron = ''; ui.buyout = false; dirtyFk = null;
  toast(`Buyout recorded: collect ${gil(q.amount)}.`);
}
// what each bartender is owed across a list of buyouts
function bartenderShares(list) {
  const by = new Map();
  for (const b of list) if (isNum(b.each)) for (const n of b.bartenders || []) by.set(n, (by.get(n) || 0) + b.each);
  return [...by.entries()].map(([name, share]) => ({name, share})).sort((a, b) => b.share - a.share || a.name.localeCompare(b.name));
}
SNAP.bar = function () {
  const list = state.buyouts.filter(b => isNum(b.amount));
  if (!list.length) return null;
  const buyouts = list.map(b => ({at: b.order, patron: b.patron || '', hours: isNum(b.hours) ? b.hours : null, amount: b.amount, house: b.house || 0, pool: b.pool || 0, bartenders: (b.bartenders || []).slice(), each: isNum(b.each) ? b.each : null}));
  return {loggedAt: Date.now(), count: buyouts.length, total: sumBy(buyouts, b => b.amount), house: sumBy(buyouts, b => b.house), pool: sumBy(buyouts, b => b.pool), shares: bartenderShares(buyouts), buyouts};
};
const splitText = b => !(b.bartenders || []).length ? 'No bartenders clocked in' : `${esc(b.bartenders.join(', '))}${isNum(b.each) ? `, ${gil(b.each)} each` : ''}`;

    panel = `<section class="panel buyout" aria-live="polite"><h3>Bar buyout</h3>
      <dl class="figs">

      ${can ? `<div class="row"><input class="field" style="max-width:260px" type="text" value="${esc(ui.buyoutPatron || '')}" data-bp="1" data-fk="buyout:patron" data-enter="buyout-record" placeholder="Who is buying it out (optional)" aria-label="Who is buying out the bar"><button type="button" class="btn primary" data-act="buyout-record">Record this buyout</button></div><p class="note">Recording saves the buyout to tonight's list below, so it can be logged to Data at the end of the night.</p>`

      ${table([['Time', '', '100px'], ['Bought by', '', '190px'], ['Hours left', 'num', '96px'], ['Collected', 'num', '120px'], ['Venue', 'num', '120px'], ['Bartenders', 'num', '120px'], 'Split between', ['', '', '70px']],
        list.map(b => `<tr><td class="pad">${esc(fmtClock(b.order))}</td><td>${can ? inp('buyouts', b.id, 'patron', b.patron, {label: 'Who bought out the bar'}) : `<span class="pad" style="display:block;padding:0 10px">${esc(b.patron)}</span>`}</td>

  }
  const acts = (can && state.buyouts.length ? confirmBtn('Clear the buyouts', 'clear-buyouts', 'clear-buyouts', unlogged('bar')) : '') + (state.buyouts.length ? logControls('bar') : '') + button;
  return {acts, panel, tonight};

// keep the button and the countdown honest as the clock moves
let barClock = '';
setInterval(() => {

  const w = openWindow(), key = !w.open ? 'closed' : ui.buyout ? 'm' + Math.ceil(w.secLeft / 60) : 'h' + w.hours;

// ── v2.13: drink cards. Clicking an item on the Bar page opens its card under it: a big picture, the price, the
// in-game item, the description, and a preparation macro, so every bartender serves it the same way. The macros are
// for staff only (barmacros/<menu item id> {text, by, at}; the menu itself is public, for the Taverna page). Whoever
// can change the Bar page (the bar manager, owners and co-owners) writes them, in the card.
const barMacroOf = id => { const d = state.barmacros.find(x => x.id === id); return d ? String(d.text || '') : ''; };
const bmLinesOf = id => macroLines({text: barMacroOf(id)});
const menuToggle = m => { const open = ui.barOpen === m.id, nm = esc(m.name || 'this item');
  return `<button type="button" class="btn sm mtoggle${open ? ' on' : ''}" data-act="menu-open" data-id="${esc(m.id)}" aria-expanded="${open}" aria-label="${open ? 'Close' : 'Open'} the card for ${nm}" title="${open ? 'Close the card' : 'Open the card: picture, description and preparation macro'}"><span class="chev" aria-hidden="true"></span></button>`; };
function menuCard(m, can) {
  const ph = menuPhoto(m), item = String(m.item || '').trim(), desc = menuDesc(m), text = barMacroOf(m.id), lines = macroLines({text}), id = esc(m.id), nm = esc(m.name || 'This item');

  const facts = `<dl class="mfacts"><div><dt>Price</dt><dd>${price}</dd></div><div><dt>In-game item</dt><dd>${item ? `<span>${esc(item)}</span><button type="button" class="btn sm" data-act="copy-item" data-item="${esc(item)}" aria-label="Copy the item name ${esc(item)}">Copy</button>` : '<span class="note">Not set yet</span>'}</dd></div></dl>`;
  const descPart = can ? `<h5><label for="md-${id}">Description</label></h5><textarea class="field" id="md-${id}" rows="3" ${attrs('menu', m.id, 'desc', 'text', 'Description of ' + (m.name || 'this item'))} placeholder="${esc(MENU_BLURBS[blurbKey(m.name)] ? 'Empty: the usual wording is used' : 'What it is, and what is in it')}">${esc(m.desc || '')}</textarea><p class="note">Shown here and on the public Taverna page.</p>`
    : desc ? `<h5>Description</h5><p class="mdesc">${esc(desc)}</p>` : '';

    : lines.length ? `<div class="mtext" id="bm-${id}">${lines.map(l => `<div>${esc(l)}</div>`).join('')}</div><div class="row bmrow">${copy}${count}</div>${bmWarn(text) ? `<p class="warn">${esc(bmWarn(text))}</p>` : ''}`

  return `<div class="mcard">${pic}<div class="minfo"><h4>${nm}</h4>${facts}${descPart}<h5>${can ? `<label for="bmx-${id}">Preparation macro</label>` : 'Preparation macro'}</h5>${macro}</div></div>`;

const bmCountText = text => { const n = macroLines({text}).length; return n ? `${n} line${n === 1 ? '' : 's'}` : 'Empty'; };
const bmWarn = text => { const i = macroIssues({text, name: ''}); return i.length ? `This will not fit in game: ${i.join('; ')}.` : ''; };
// typing in the macro box: the count and the warning follow along
function bmInput(t) {
  const id = t.dataset.barmacro, c = main.querySelector(`[data-bmcount="${CSS.escape(id)}"]`), w = main.querySelector(`[data-bmwarn="${CSS.escape(id)}"]`), msg = bmWarn(t.value);
  if (c) c.textContent = bmCountText(t.value);

function saveBarMacro(t) {
  const id = t.dataset.barmacro; if (!id || lvl('bar') < 2 || ui.ro || !state.menu.some(m => m.id === id)) return;
  if (t.dataset.fk === dirtyFk) dirtyFk = null;
  const text = String(t.value || '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+|\n+$/g, '').slice(0, 4000);
  if (text === barMacroOf(id)) return;
  const cur = state.barmacros.find(x => x.id === id);
  if (!text) { if (cur) { state.barmacros = state.barmacros.filter(x => x !== cur); store.remove('barmacros', id); toast('Preparation macro removed.'); } scheduleRender(); return; }
  const doc = {text, by: myName().slice(0, 80), at: Date.now()};
  if (cur) Object.assign(cur, doc); else state.barmacros.push({...doc, id});
  store.merge('barmacros/' + id, doc).then(() => toast('Preparation macro saved.'), () => {});
  scheduleRender();
}
function barAct(name, el) {
  const id = el.dataset.id;
  if (name === 'menu-open') { ui.barOpen = ui.barOpen === id ? null : id; scheduleRender(); return; }
  if (name === 'bm-copy') {
    const lines = bmLinesOf(id); if (!lines.length) return;
    copyText(lines.join(NL), document.getElementById('bm-' + id) || document.getElementById('bmx-' + id)).then(ok => {
      if (ok) { ui.copied = 'bm:' + id; scheduleRender(); setTimeout(() => { if (ui.copied === 'bm:' + id) { ui.copied = null; scheduleRender(); } }, 2000); toast('Macro copied. Paste it into an empty User Macro in game.'); }
      else toast('Copy was blocked here. The macro is selected: copy it by hand.');
    });
  }
}

// (since v2.15 each department has an assistant manager too, who sees what the manager sees)
const MANAGER_NAMES = {mgr_bar: 'the Bar managers', mgr_bouncer: 'the Bouncer managers', mgr_dancer: 'the Dancer managers', mgr_foh: 'the Front of House managers', mgr_dealer: 'the Dealer managers'};
const validForm = f => !!f && Array.isArray(f.steps) && f.steps.length > 0 && Array.isArray(f.questions) && Array.isArray(f.positions) && f.positions.length > 0;
function form() { const d = state.docs['appform/main']; return validForm(d) ? d : DEFAULT_FORM; }

// the line follows the hours if they change. Left empty, there is no hours line.
function formHours() { const f = form(); return typeof f.hours === 'string' ? f.hours : DEFAULT_FORM.hours; }
function fillHours(t) {
  const c = state.config;
  return String(t || '').replace(/\{(day|open|close|zone)\}/g, (_, k) => k === 'day' ? OPEN_DAY_NAME : k === 'open' ? shortClock(c.startTime) : k === 'close' ? shortClock(c.closeTime) : tzShort());
}
const livePositions = (f = form()) => f.positions.filter(p => !p.retired);
// a position by name; one that has since been removed is looked up in the original form
const positionOf = (name, f = form()) => f.positions.find(p => p.name === name) || DEFAULT_FORM.positions.find(p => p.name === name) || null;
const managerName = (pos, f) => { const p = positionOf(pos, f); return (p && MANAGER_NAMES[p.manager]) || ''; };
const seenByText = (pos, f) => 'the owners and co-owners' + (managerName(pos, f) ? ' and ' + managerName(pos, f) : ' only');
const posShown = name => String(name || '').replace(/ \/ /g, '/');
// the disclaimer is plain text, with **bold**
const richText = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
// what changing the form means for the pages that depend on it: which applications a manager reads
function formChanged() { watchApps(); paintTabs(); }

// every step of the application: the general ones, then the position, then the disclaimer
function appSteps(f = form()) {
  const t = f.stepTitles || {};
  return [...f.steps.map(s => ({...s, kind: 'general'})), {kind: 'position', title: t.position || 'Position'}, {kind: 'disclaimer', title: t.disclaimer || 'Disclaimer'}];
}

function askedOf(qs, a) {
  const shown = new Set(), out = [];
  for (const q of qs || []) {
    if (q.when && q.when.q && !(shown.has(q.when.q) && (q.when.is || []).includes(a[q.when.q]))) continue;
    out.push(q); shown.add(q.id);
    if (q.kind === 'choice' && q.stop && q.stop.on && a[q.id] === q.stop.on) { out.push({kind: 'stop', title: q.stop.title, text: q.stop.text}); break; }
  }
  return out;
}
// The questions on one step (counted from 1), given the answers so far. `positions` are the ones open to pick.
function appQuestions(step, a, positions, f = form()) {
  const st = appSteps(f)[step - 1];
  if (!st) return [];
  if (st.kind === 'disclaimer') return [{id: 'agree', kind: 'choice', title: f.agreeTitle || 'Do you agree with the disclaimer above?', opts: [f.agree || 'Yes, I agree'], toggle: true}];
  if (st.kind === 'position') {
    const all = livePositions(f).map(p => p.name), open = positions || all, full = all.filter(p => !open.includes(p)), rq = f.roleQuestion || {};
    const out = [{id: 'role', kind: 'choice', title: rq.title || 'What position would you like to apply for?', help: rq.help || '', opts: open, note: full.length ? `Full right now, so not on the list: ${listWords(full)}.` : ''}];
    const p = a.role && f.positions.find(x => x.name === a.role);
    return p ? out.concat(askedOf(p.questions, a)) : out;

  return askedOf(f.questions.filter(q => q.step === st.id), a);
}
const appAnswered = (q, a) => q.kind === 'info' ? true : q.kind === 'stop' ? false : String(a[q.id] || '').trim() !== '';
const appMissing = (step, a, positions, f) => appQuestions(step, a, positions, f).filter(q => !appAnswered(q, a));
const appStopped = (step, a, positions, f) => appQuestions(step, a, positions, f).some(q => q.kind === 'stop');
// What an application keeps of the questions it answered, so editing the form later never changes how it reads:
// [{id, t: the question, k: its kind, g: its step (or position), h: its section in the Discord message, s: its
// name there, empty for just the answer}]
function askedSnapshot(a, open, f = form()) {
  const out = [];
  appSteps(f).forEach((st, i) => {
    let head = st.kind === 'general' ? (st.heading || st.title) : '';
    if (st.kind === 'position') { const p = positionOf(a.role, f); head = `${(p && p.emoji) || '📜'} ${posShown(a.role)} Application`; }
    for (const q of appQuestions(i + 1, a, open, f)) {
      if (!q.id || q.kind === 'info' || q.kind === 'stop' || q.id === 'role' || q.id === 'agree') continue;
      if (q.heading) head = q.heading;
      out.push({id: q.id, t: String(q.title || '').slice(0, 300), k: q.kind, g: String(st.kind === 'position' ? a.role : st.title).slice(0, 60), h: String(head).slice(0, 120), s: q.bare ? '' : String(q.short || q.title || '').slice(0, 80)});

}

  if (dc.error === 'bad-token') return {ok: false, text: 'Discord does not accept Hermes\' bot token. Set it again (BOT-SETUP.txt, step 6), then deploy.'};
  // anything else names its reason in brackets, so it can be looked up

  if (dc.error === 'not-found') return {ok: false, text: 'Firebase doesn\'t have Hermes\' functions yet. Run firebase deploy, then Check again.' + why};
  if (dc.error === 'permission-denied') return {ok: false, text: 'Only owners, co-owners and the administrator can use Hermes.' + why};
  if (dc.error === 'unauthenticated') return {ok: false, text: 'Firebase didn\'t recognise your sign-in. Sign out and back in, then Check again.' + why};
  if (dc.error === 'network' || /^discord-(429|5\d\d)/.test(dc.error)) return {ok: false, text: 'Firebase couldn\'t get through to Discord just now. Check again in a minute.' + why};
  if (/^discord-/.test(dc.error)) return {ok: false, text: 'Discord turned Hermes away.' + why};

  h = h.replace(/&lt;@&amp;(\d+)&gt;/g, (_, id) => hold(`<span class="dcmention">@${esc(roles.get(id) || 'role')}</span>`));
  h = h.replace(/&lt;@!?(\d+)&gt;/g, (_, id) => hold(`<span class="dcmention">@${esc(dc.names[id] || 'someone')}</span>`));
  h = h.replace(/&lt;#(\d+)&gt;/g, (_, id) => hold(`<span class="dcmention">#${esc(chans.get(id) || 'channel')}</span>`));
  h = h.replace(/@(everyone|here)\b/g, (_, w) => hold(`<span class="dcmention">@${w}</span>`));
  h = h.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<b><i>$1</i></b>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/__([^_\n]+)__/g, '<u>$1</u>')

  if (!/^(image|video)\//.test(file.type)) { toast('Pick a picture or a video.'); return; }
  if (file.size > limit) { toast(`That file is ${mb(file.size)}. Discord takes up to ${mb(limit)} in your server.`); return; }
  const eid = ep.eid, path = `eventmedia/${eid}/${Date.now()}-${file.name.replace(/[^\w.-]+/g, '_').slice(-80)}`;

    }, () => {});

/* ───────────── Editing the application: owners, co-owners and the administrator ───────────── */
// The editor works on a copy (ui.fe.draft) and saves it whole to appform/main. Applications already sent keep the

const canEditForm = () => me.admin || (!state.config.maintenance && isOwnerRole());
const FE_KINDS = [['choice', 'Pick one'], ['text', 'Short answer'], ['para', 'Paragraph'], ['info', 'Note']];

function feOpen() {

  ui.confirm = null; scheduleRender(); toContentTop();
}
function feDirty() {

// where a question is in the draft: its list, and the questions it sits among (its step, or its position)
function feFind(id) {

  if (i >= 0) return {list: d.questions, i, q: d.questions[i], scope: d.questions.filter(q => q.step === d.questions[i].step)};
  for (const p of d.positions) { i = p.questions.findIndex(q => q.id === id); if (i >= 0) return {list: p.questions, i, q: p.questions[i], scope: p.questions}; }

// a typed or picked change in the editor; `done` redraws the page (a pick, or leaving a field)
function feSet(t, done) {
  if (!ui.fe) return;
  const [kind, key, field] = t.dataset.fe.split('|'), d = ui.fe.draft, v = t.type === 'checkbox' ? t.checked : t.value;
  if (kind === 'q') {
    const hit = feFind(key); if (!hit) return;
    const q = hit.q;
    if (['title', 'help', 'short', 'heading'].includes(field)) q[field] = v;

      // a follow-up keeps only the answers that are still choices here
      for (const x of hit.scope) if (x.when && x.when.q === q.id) x.when.is = x.when.is.filter(o => q.opts.includes(o));
    } else if (field === 'kind') {
      q.kind = v;
      if (v === 'choice' && !(q.opts || []).length) q.opts = ['Yes', 'No'];
      if (v !== 'choice') delete q.stop;
      if (v === 'info') { delete q.short; delete q.bare; delete q.heading; delete q.help; }
      done = true;
    } else if (field === 'bare') { q.bare = !!v; done = true; }
    else if (field === 'when') { if (v) q.when = {q: v, is: []}; else delete q.when; done = true; }
    else if (field === 'wheni') {
      const ref = hit.scope.find(x => x.id === (q.when || {}).q); if (!ref) return;
      const is = new Set(q.when.is); if (v) is.add(t.dataset.v); else is.delete(t.dataset.v);
      q.when.is = (ref.opts || []).filter(o => is.has(o)); done = true;
    } else if (field === 'stopon') {
      if (v) q.stop = {on: v, title: (q.stop && q.stop.title) || 'Thank you for your interest.', text: (q.stop && q.stop.text) || 'We cannot go ahead with your application.'};
      else delete q.stop;
      done = true;
    } else if (field === 'stoptitle' && q.stop) q.stop.title = v;
    else if (field === 'stoptext' && q.stop) q.stop.text = v;
  } else if (kind === 'step') {
    const s = d.steps.find(x => x.id === key); if (s && (field === 'title' || field === 'heading')) s[field] = v;
  } else if (kind === 'pos') {

    if (field === 'offered') { p.retired = !v; done = true; }
