<html lang="en" data-theme="dark">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* v2.18: one person's About box, on its own, for an Embed element on a Carrd: apolloncc.org/embed/<their id>.
   ?theme=light for the light colours. It tells the Carrd page how tall it is, so the box fits what is in it. */

  --bio-gold:#E2B95F;--bio-rose:#F29AB0;--bio-red:#F07A7A;--bio-orange:#F4A261;--bio-green:#6FCF97;--bio-teal:#5FD3C9;--bio-blue:#7FB2F0;--bio-purple:#B39DF5;--bio-pink:#F5A3E6;--bio-grey:#A3A9C6;
}
:root[data-theme="light"]{
  --ink:#161A33;--muted:#565C76;--gold:#8A600E;
  --box-bg:radial-gradient(70% 150px at 50% 0,rgba(184,134,42,.12),transparent),linear-gradient(180deg,#FFFFFF,#FBF7EE);
  --box-edge:rgba(184,134,42,.62);--box-frame:#FFFFFF;--box-hair:rgba(184,134,42,.3);

.bio{white-space:pre-wrap;line-height:1.55}

.codeframe{display:block;width:100%;border:0;background:transparent;color-scheme:dark}

.team{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px}

  background:radial-gradient(90% 60% at 50% 0,rgba(226,185,95,.14),transparent 70%),#000;color:#fff;font:inherit;text-align:center;cursor:pointer;transition:border-color .15s,box-shadow .15s}

.tile:focus-visible,.shut:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ava{display:block;width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 25%;box-shadow:0 0 0 3px #000,0 0 0 4px #E2B95F}

.nm{max-width:100%;font:600 16px/1.25 Cinzel,Georgia,serif;color:#F7E3A6;overflow-wrap:normal}
.jb{max-width:100%;font:500 10.5px/1.4 Cinzel,Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#E2B95F}
.opened{flex:0 0 100%;min-width:0}
.openrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px;margin:8px 4px 4px}
.openrow .full{margin:0}
.shut{padding:6px 14px;border:1px solid rgba(226,185,95,.7);border-radius:999px;background:#000;color:#F7E3A6;font:500 13px/1 'Hanken Grotesk',system-ui,sans-serif;cursor:pointer}
.shut:hover{border-color:#E2B95F}
.casino{container-type:inline-size}
.games{display:grid;gap:26px}
.gameslot{display:flex;flex-direction:column;min-width:0}
.gameslot>iframe{flex:1 0 auto}
@container (min-width:860px){.games:has(>.gameslot+.gameslot){grid-template-columns:repeat(2,minmax(0,1fr))}}
.tdiv{display:flex;align-items:center;gap:12px;max-width:560px;margin:22px auto}
.tdiv::before,.tdiv::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(226,185,95,.8))}
.tdiv::after{background:linear-gradient(270deg,transparent,rgba(226,185,95,.8))}
.tdiv i{width:8px;height:8px;border:1px solid #E2B95F;transform:rotate(45deg)}
.teamnone{margin:0;padding:10px;text-align:center;color:#A3A9C6;font-style:italic}
@media (max-width:420px){.team{gap:10px}.tile{flex-basis:calc(50% - 5px)}.ava{width:72px;height:72px}.nm{font-size:14px}}
:root[data-theme="light"] .codeframe{color-scheme:light}

.bl{min-height:1.2em}.bc{text-align:center}

  document.title = `${sec[1]} | Apollo Night Club and Casino`;
  // v2.22.3: a department's managers and assistant managers have a row of their own, above the staff they manage
  const split = team.key !== 'owners', leads = split ? list.filter(x => carrdRank(x.role) < 3) : [], rest = split ? list.filter(x => carrdRank(x.role) >= 3) : list;
  const grid = (ps, label, cls) => ps.length ? `<div class="team${cls}" role="list" aria-label="${esc(label)}">${ps.map(tileHtml).join('')}</div>` : '';
  box.innerHTML = list.length ? grid(leads, `${sec[1]}: managers`, ' leads') + (leads.length && rest.length ? '<div class="tdiv" aria-hidden="true"><i></i></div>' : '') + grid(rest, sec[1], '')
    : '<p class="teamnone">No one here yet.</p>';
  const p = list.find(x => x.id === team.open);
  if (p) {
    const panel = document.createElement('div'); panel.className = 'opened'; panel.id = 'open-card';
    aboutInto(panel, p, `<p class="openrow"><button type="button" class="shut" data-shut="1">Close</button></p>`, true);
    box.querySelector(`.tile[data-id="${CSS.escape(p.id)}"]`).closest('.team').append(panel); placeOpen();
  }
  tell();
}
// the open card sits just under the row of the tile that opened it. It stays last in the page and is shown there
// with flex order: moving it would reload the card in it, which changes its height, which can change the width
// (a scrollbar on the Carrd page), which moves it again.
function placeOpen() {
  const panel = box.querySelector('.opened'), tile = team.open && box.querySelector(`.tile[data-id="${CSS.escape(team.open)}"]`); if (!panel || !tile) return;
  const tiles = [...tile.closest('.team').querySelectorAll('.tile')];
  // measured with the card shown last, where it breaks no row
  tiles.forEach(t => { t.style.order = ''; }); panel.style.order = '2';
  const top = tile.offsetTop, last = tiles.map(t => t.offsetTop === top).lastIndexOf(true);
  tiles.forEach((t, i) => { if (i > last) t.style.order = '3'; });
}
let placedW = innerWidth;
addEventListener('resize', () => { if (innerWidth === placedW) return; placedW = innerWidth; placeOpen(); });
box.addEventListener('click', e => {
  const t = e.target.closest('.tile'), shut = e.target.closest('[data-shut]');
  if (shut) { const was = team.open; team.open = ''; showTeam(); const back = was && box.querySelector(`.tile[data-id="${CSS.escape(was)}"]`); if (back) back.focus(); return; }
  if (!t) return;
  team.open = team.open === t.dataset.id ? '' : t.dataset.id; showTeam();
  const again = box.querySelector(`.tile[data-id="${CSS.escape(t.dataset.id)}"]`); if (again) again.focus();
});
const parts = location.pathname.split('/').filter(Boolean);
const teamKey = parts[1] === 'team' ? decodeURIComponent(parts[2] || '') : '';
// v2.27: Apollo Casino's rules: /embed/casino for every game, /embed/casino/<game> for one
const casinoKey = parts[1] === 'casino' ? (() => { try { return decodeURIComponent(parts[2] || ''); } catch { return parts[2] || ''; } })().toLowerCase() : null;
if (!window.firebase || (!key && !teamKey && casinoKey === null)) { show(null); return; }
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
// the site's settings: whether every About box is the Apollo card, and which roles are in which Carrd section
let cfg = {};
// the person is found by their id (which never changes), or else by the name in a profile's address
let stop = null;
async function find() {
  for (const coll of ['people', 'mortals']) {
    try { const d = await db.collection(coll).doc(key).get(); if (d.exists) return {coll, id: d.id}; } catch { /* not a usable id */ }
  }
  for (const coll of ['people', 'mortals']) {
    try {
      const snap = await db.collection(coll).get(), list = snap.docs.map(d => ({id: d.id, ...d.data()})), m = slugMap(list, cardName);
      const hit = list.find(x => m.get(x.id) === key.toLowerCase()); if (hit) return {coll, id: hit.id};
    } catch { /* that list could not be read */ }
  }
  return null;
}
async function follow() {
  if (stop) { stop(); stop = null; }
  const at = await find();
  if (!at) { show(null); return; }
  // it stays up to date: an edit on the site shows here straight away (and a Mortal made staff is found again)
  stop = db.collection(at.coll).doc(at.id).onSnapshot(s => { if (s.exists) show({coll: at.coll, id: s.id, ...s.data()}); else follow(); }, () => show(null));
}
function followTeam() {
  team.key = teamKey;
  db.collection('config').doc('main').onSnapshot(d => { cfg = d.exists ? d.data() || {} : {}; showTeam(); }, () => {});
  db.collection('people').onSnapshot(s => { team.list = s.docs.map(d => ({coll: 'people', id: d.id, ...d.data()})); showTeam(); }, () => { team.list = []; showTeam(); });
}
let casinoSig = '';
function showCasino() {
  const all = gamesOf(cfg), list = casinoKey ? all.filter(g => g.id === casinoKey) : all;
  const sig = JSON.stringify(list); if (sig === casinoSig) return; casinoSig = sig;
  document.title = `${list.length === 1 ? list[0].name + ' rules' : 'Rules'} | Apollo Casino`;
  if (!list.length) { box.innerHTML = `<p class="teamnone">${casinoKey ? 'These rules are not on the site any more.' : 'The house rules will be posted here.'}</p>`; tell(); return; }
  box.innerHTML = `<div class="casino"><div class="games">${list.map(g => `<div class="gameslot" data-g="${esc(g.id)}"></div>`).join('')}</div></div>`;
  for (const g of list) {
    const f = document.createElement('iframe'), who = 'game:' + g.id;
    f.className = 'codeframe'; f.title = `${g.name || 'Game'} rules`; f.dataset.who = who; f.style.height = (frameTall[who] || 900) + 'px';
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox'); f.setAttribute('referrerpolicy', 'no-referrer');
    f.srcdoc = frameDoc(gameCardHtml(g));
    box.querySelector(`[data-g="${CSS.escape(g.id)}"]`).append(f);
  }
  tell();
}
if (casinoKey !== null) db.collection('config').doc('main').onSnapshot(d => { cfg = d.exists ? d.data() || {} : {}; showCasino(); }, () => showCasino());
else if (teamKey) followTeam();
else db.collection('config').doc('main').get().then(d => { cfg = d.exists ? d.data() || {} : {}; }, () => {}).then(follow);
})();
</script>
